tool_id: redis_cli_probe
version: 1.0.0
phase: recon
category: network
risk_level: low
requires_approval: false
default_timeout_s: 300
description: redis-cli probe — INFO + CONFIG GET against an unauthenticated Redis
  instance at {host}:{port}. Read-only commands only (no FLUSHALL / SLAVEOF / DEBUG);
  surfaces version banner and the dangerous-by-default CONFIG keys (dir / dbfilename
  / requirepass) that enable §4.15 module-load RCE on unprotected instances. Output
  text-only (parser deferred to Cycle 3). Backlog/dev1_md §4.17. ARG-019.
command_template:
- sh
- -c
- redis-cli -h {host} -p {port} INFO > {out_dir}/redis_info.txt && redis-cli -h {host}
  -p {port} CONFIG GET '*' >> {out_dir}/redis_info.txt
