tool_id: censys
version: 1.0.0
phase: recon
category: recon
risk_level: passive
requires_approval: false
default_timeout_s: 600
description: Censys CLI passive search for hosts with TLS certs covering the target
  domain. Requires CENSYS_API_ID and CENSYS_API_SECRET. Backlog/dev1_md §4.1.
command_template:
- sh
- -c
- censys search 'services.tls.certificates.leaf_data.names:{domain}' -o {out_dir}/censys.json
command_string: sh -c censys search 'services.tls.certificates.leaf_data.names:{domain}'
