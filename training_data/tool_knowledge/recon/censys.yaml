network_policy_name: recon-passive
scenarios:
- description: Run censys against target
  example: sh -c censys search 'services.tls.certificates.leaf_data.names:{domain}'
    -o {out_dir}/censys.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Information gathering and discovery phase. Censys CLI passive search
  for hosts with TLS certs covering the target domain. Requires CENSYS_API_ID and
