tool_id: ike_scan
version: 1.0.0
phase: recon
category: network
risk_level: low
requires_approval: false
default_timeout_s: 600
description: ike-scan — IKEv1/v2 IPsec endpoint discovery against {host} (UDP/500).
  -A enables aggressive-mode handshake to capture pre-shared-key hash material on
  misconfigured peers; -M emits multi-line / verbose output. Read-only single-shot
  probe — does not exhaust DH key material. Output text-only (parser deferred to Cycle
  3). Backlog/dev1_md §4.17. ARG-019.
command_template:
- sh
- -c
- ike-scan -M -A {host} > {out_dir}/ike_scan.txt
command_string: sh -c ike-scan -M -A {host} > {out_dir}/ike_scan.txt
placeholders:
