tool_id: ffuf_vhost
version: 1.0.0
phase: recon
category: recon
risk_level: low
requires_approval: false
default_timeout_s: 600
description: 'ffuf vhost discovery via Host header fuzzing. Caller MUST pass {size}
  as the baseline response size in bytes (e.g. ''1234''); -fs filters that size out.
  Author: ffuf project. Backlog/dev1_md §4.5.'
command_template:
- ffuf
- -u
- https://{ip}
- -H
- 'Host: FUZZ.{domain}'
- -w
- '{wordlist}'
- -mc
- all
- -fs
- '{size}'
- -o
- '{out_dir}/ffuf_vhost.json'
- -of
- json
command_string: 'ffuf -u https://{ip} -H Host: FUZZ.{domain} -w {wordlist} -mc all
  -fs {size} -o {out_dir}/ffuf_vhost.json -of json'
placeholders:
  https://{ip: <https://{ip>
  'Host: FUZZ.{domain': '<Host: FUZZ.{domain>'
  wordlist: <wordlist>
  size: <size>
  out_dir}/ffuf_vhost.json: <out_dir}/ffuf_vhost.json>
output_format: json_object
evidence_artifacts: &id001
- /out/ffuf_vhost.json
cwe_ids:
- 200
owasp_wstg:
- WSTG-INFO-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run ffuf_vhost against target
  example: 'ffuf -u https://{ip} -H Host: FUZZ.{domain} -w {wordlist} -mc all -fs
    {size} -o {out_dir}/ffuf_vhost.json -of json'
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Information gathering and discovery phase. ffuf vhost discovery via
  Host header fuzzing. Caller MUST pass {size} as the baseline response size in bytes
  (e.g. ''1234''); -fs filters that size out. Author: ffuf project. Backlog/dev1_md
  §4.5.'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
