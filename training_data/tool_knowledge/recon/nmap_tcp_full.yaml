tool_id: nmap_tcp_full
version: 1.0.0
phase: recon
category: network
risk_level: low
requires_approval: false
default_timeout_s: 7200
description: Nmap TCP SYN scan across all 65535 ports with rate-limited probes; full
  port-exposure map. Backlog/dev1_md §4.2.
command_template:
- nmap
- -sS
- -Pn
- -p-
- -T4
- --min-rate
- '2000'
- -oX
- '{out_dir}/nmap_full.xml'
- '{ip}'
command_string: nmap -sS -Pn -p- -T4 --min-rate 2000 -oX {out_dir}/nmap_full.xml {ip}
placeholders:
  out_dir}/nmap_full.xml: <out_dir}/nmap_full.xml>
  ip: 10.10.1.100
output_format: xml_nmap
evidence_artifacts: &id001
- /out/nmap_full.xml
cwe_ids:
- 200
- 668
owasp_wstg:
- WSTG-INFO-02
- WSTG-INFO-04
image: argus-kali-recon:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Full port scan on high-value target
  example: nmap -sS -Pn -p- -T4 -oX /out/nmap_tcp_full.xml 10.0.0.1
