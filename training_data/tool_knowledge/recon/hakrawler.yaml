tool_id: hakrawler
version: 1.0.0
phase: recon
category: recon
risk_level: low
requires_approval: false
default_timeout_s: 600
description: 'hakrawler subdomain + endpoint crawler; depth 3, follows subdomains.
  Image-side wrapper `hakrawler-wrapper` translates argv-form (`-url <url> -depth
  N -subs -out <path>`) to upstream stdin/stdout pipe (`echo <url> | hakrawler -d
  N -subs > <path>`) so the sandbox stays argv-only (no shell metachars). Active crawl.
  Author: hakluke (https://github.com/hakluke/hakrawler). Backlog/dev1_md §4.6.'
command_template:
- hakrawler-wrapper
- -url
- '{url}'
- -depth
- '3'
- -subs
- -out
- '{out_dir}/hakrawler.txt'
command_string: hakrawler-wrapper -url {url} -depth 3 -subs -out {out_dir}/hakrawler.txt
placeholders:
  url: https://target.example.com
  out_dir}/hakrawler.txt: <out_dir}/hakrawler.txt>
output_format: text_lines
evidence_artifacts: &id001
- /out/hakrawler.txt
cwe_ids:
- 200
owasp_wstg:
- WSTG-INFO-06
- WSTG-INFO-07
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run hakrawler against target
  example: hakrawler-wrapper -url {url} -depth 3 -subs -out {out_dir}/hakrawler.txt
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Information gathering and discovery phase. hakrawler subdomain + endpoint
  crawler; depth 3, follows subdomains. Image-side wrapper `hakrawler-wrapper` translates
  argv-form (`-url <url> -depth N -subs -out <path>`) to upstream stdin/stdout pipe
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
