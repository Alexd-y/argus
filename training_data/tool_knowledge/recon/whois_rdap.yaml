- -c
- whois {domain} > {out_dir}/whois.txt ; curl -sS --fail-with-body --max-time 30 https://rdap.org/domain/{domain}
  -o {out_dir}/rdap.json
command_string: sh -c whois {domain} > {out_dir}/whois.txt ; curl -sS --fail-with-body
