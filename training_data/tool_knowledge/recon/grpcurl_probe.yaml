tool_id: grpcurl_probe
version: 1.0.0
phase: recon
category: network
risk_level: low
requires_approval: false
default_timeout_s: 300
description: 'grpcurl reflection-based service enumerator — issues one `list` reflection
  call against {host}:{port} (plaintext). One service/method per line in /out/grpc.txt.
  Read-only, never invokes RPCs; only enumerates schema when server reflection is
  enabled. `sh -c` is used solely for stdout redirection (placeholders RFC-validated,
  no shell injection). Parser deferred to Cycle 3. Author: fullstorydev. Backlog §4.14.
  ARG-018.'
command_template:
- sh
- -c
- grpcurl -plaintext {host}:{port} list > {out_dir}/grpc.txt
command_string: sh -c grpcurl -plaintext {host}:{port} list > {out_dir}/grpc.txt
placeholders:
  grpcurl -plaintext {host}:{port} list > {out_dir}/grpc.txt: <grpcurl -plaintext
    {host}:{port} list > {out_dir}/grpc.txt>
output_format: text_lines
evidence_artifacts: &id001
- /out/grpc.txt
cwe_ids:
