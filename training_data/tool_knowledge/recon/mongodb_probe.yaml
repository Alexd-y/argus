tool_id: mongodb_probe
version: 1.0.0
phase: recon
category: network
risk_level: low
requires_approval: false
default_timeout_s: 300
description: mongosh probe — anonymous MongoDB enumeration against {host}:{port}.
  Read-only serverStatus + listDatabases roundtrip; surfaces version, build flags,
  and the database inventory exposed by missing-auth deployments (the canonical 'open
  mongo' misconfiguration). Output text-only (parser deferred to Cycle 3). Backlog/dev1_md
  §4.17. ARG-019.
command_template:
- sh
- -c
- 'mongosh --host {host} --port {port} --quiet --eval ''JSON.stringify({serverStatus:
  db.serverStatus({asserts:0,connections:1,host:1,version:1}), dbs: db.adminCommand({listDatabases:1,
  nameOnly:true})})'' > {out_dir}/mongo_info.json'
