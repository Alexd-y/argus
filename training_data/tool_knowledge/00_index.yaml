usage_notes: |
  This knowledge base is designed for LLM RAG in the ARGUS training pipeline.
  
  Each tool YAML file contains:
  - tool_id: Maps directly to ARGUS backend/config/tools/*.yaml
  - typical_commands: Real command examples with ARGUS-compatible placeholder paths
  - common_flags: Flags with descriptions for command generation training
  - when_to_use: Context for tool selection training
  - key_outputs: Expected outputs for finding triage training
  - dependencies: Tool ordering for pipeline planning
  - cwe/owasp: Associated vulnerability classes for payload family selection
  - tips: Operational notes for methodology training
  
  Tool scenarios file (07_tool_scenarios.yaml) enriches tools with:
  - scenarios: Concrete usage scenarios with example commands
  - next_steps: Recommended tools to run after the current one
  - related_tools: Tools commonly used together
  
  Methodology files contain:
  - Ordered steps with tool recommendations and verification criteria
  - Phase transitions and conditions for moving to next phase
  - Attack chains with MITRE ATT&CK techniques
  - Target-type-specific workflows (web_app, internal_network, ad_environment)
  
  No sanitization applied — all real IPs, domains, credentials, and commands
  preserved as-is per project requirements.