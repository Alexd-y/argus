tool_id: nuclei
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 1800
description: 'ProjectDiscovery nuclei flagship template-driven vulnerability scanner
  — runs the full curated template set (info..critical) against {url}, JSONL output.
  Rate-limited (50 r/s, c=10) to keep the host budget bounded. Author: ProjectDiscovery
  (https://github.com/projectdiscovery/nuclei). Backlog/dev1_md §4.8. Templates ship
  in image; parser is the flagship NUCLEI_JSONL handler in src/sandbox/parsers/nuclei_parser.py
  shared with the §4.7 wrappers.'
command_template:
- nuclei
- -target
- '{url}'
- -severity
- info,low,medium,high,critical
- -jsonl
- -output
- '{out_dir}/nuclei.jsonl'
- -disable-update-check
- -no-color
- -rate-limit
- '50'
- -c
- '10'
- -stats
command_string: nuclei -target {url} -severity info,low,medium,high,critical -jsonl
  -output {out_dir}/nuclei.jsonl -disable-update-check -no-color -rate-limit 50 -c
  10 -stats
placeholders:
  url: https://target.example.com
  out_dir}/nuclei.jsonl: <out_dir}/nuclei.jsonl>
output_format: nuclei_jsonl
evidence_artifacts: &id001
- /out/nuclei.jsonl
cwe_ids:
- 16
- 200
- 1395
owasp_wstg:
- WSTG-INFO-08
- WSTG-CONF-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: CVE and vulnerability scanning on discovered URLs
  example: nuclei -l /in/urls.txt -t cves/ -t vulnerabilities/ -severity critical,high,medium
    -o /out/nuclei.txt
  output_type: text
  next_steps:
  - dalfox for XSS testing
  - sqlmap_safe for SQL injection
related_tools:
- httpx
- nikto
- dalfox
- sqlmap_safe
when_to_use: Vulnerability identification and analysis phase. ProjectDiscovery nuclei
  flagship template-driven vulnerability scanner — runs the full curated template
  set (info..critical) against {url}, JSONL output. Rate-limited (50 r/s, c=10) to
  keep the host b
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
