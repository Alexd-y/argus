tool_id: kube_hunter
version: 1.0.0
phase: vuln_analysis
category: cloud
risk_level: medium
requires_approval: true
default_timeout_s: 1800
description: 'Aqua kube-hunter remote Kubernetes attack-surface scanner — sends a
  fixed catalogue of safe probes (open API server, exposed dashboards, etcd/kubelet
  ports, default service-account tokens, anonymous auth) at the cluster reachable
  from {host}. Approval-gated, risk=medium: an *active* scan that issues real HTTP
  requests against the K8s control plane and may trip IDS/audit alerts. `sh -c` is
  used solely for stdout redirection. Parser deferred to Cycle 3. Author: Aqua. Backlog
  §4.15. ARG-018.'
command_template:
- sh
- -c
- kube-hunter --remote {host} --report json --log none > {out_dir}/kubehunter.json
command_string: sh -c kube-hunter --remote {host} --report json --log none > {out_dir}/kubehunter.json
placeholders:
  kube-hunter --remote {host} --report json --log none > {out_dir}/kubehunter.json: <kube-hunter
    --remote {host} --report json --log none > {out_dir}/kubehunter.json>
output_format: json_object
evidence_artifacts: &id001
- /out/kubehunter.json
cwe_ids:
- 16
- 200
- 285
- 287
- 668
owasp_wstg:
- WSTG-CONF-04
- WSTG-INFO-08
- WSTG-ATHN-01
image: argus-kali-cloud:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run kube_hunter against target
  example: sh -c kube-hunter --remote {host} --report json --log none > {out_dir}/kubehunter.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Aqua kube-hunter remote
  Kubernetes attack-surface scanner — sends a fixed catalogue of safe probes (open
  API server, exposed dashboards, etcd/kubelet ports, default service-account tokens,
  anonymous a
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
