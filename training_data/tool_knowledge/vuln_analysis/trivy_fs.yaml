tool_id: trivy_fs
version: 1.0.0
phase: vuln_analysis
category: cloud
risk_level: passive
requires_approval: false
default_timeout_s: 1800
description: 'Aqua Trivy filesystem scanner — sweeps the source tree mounted at {path}
  (under /in) for SCA findings (vulnerable lockfiles), IaC misconfigurations (Terraform/K8s/Dockerfiles),
  and embedded secrets. Network is used only to refresh the local vulnerability DB;
  --offline-scan will land in Cycle 4 alongside offline-no-egress + bundled DB. Output
  identical to trivy_image, consumed by sandbox/parsers/trivy_parser.py via JSON_OBJECT.
  Author: Aqua. Backlog §4.15. ARG-018.'
command_template:
- trivy
- fs
- --format
- json
- -o
- '{out_dir}/trivy_fs.json'
- --scanners
- vuln,config,secret
- --severity
- UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
- --no-progress
- --quiet
- '{path}'
command_string: trivy fs --format json -o {out_dir}/trivy_fs.json --scanners vuln,config,secret
  --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --no-progress --quiet {path}
placeholders:
  out_dir}/trivy_fs.json: <out_dir}/trivy_fs.json>
  path: <path>
output_format: json_object
evidence_artifacts: &id001
- /out/trivy_fs.json
cwe_ids:
- 16
- 200
- 732
- 798
- 1395
owasp_wstg:
- WSTG-CONF-04
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: recon-passive
scenarios:
- description: Run trivy_fs against target
  example: trivy fs --format json -o {out_dir}/trivy_fs.json --scanners vuln,config,secret
    --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --no-progress --quiet {path}
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Aqua Trivy filesystem
  scanner — sweeps the source tree mounted at {path} (under /in) for SCA findings
  (vulnerable lockfiles), IaC misconfigurations (Terraform/K8s/Dockerfiles), and embedded
  secrets. N
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
