tool_id: grype
version: 1.0.0
phase: vuln_analysis
category: cloud
risk_level: passive
requires_approval: false
default_timeout_s: 1800
description: 'Anchore Grype vulnerability scanner — pulls {image}, derives the SBOM
  via bundled Syft, then matches packages against the Anchore vuln DB (NVD + Alpine/Debian/RH/Ubuntu/GHSA
  advisories). Output: canonical Grype JSON (matches[]). `sh -c` is used solely for
  stdout redirection. recon-passive = TCP/443 to registries + DB feed. Parser deferred
  to Cycle 3. Author: Anchore. Backlog §4.15. ARG-018.'
command_template:
- sh
- -c
- grype {image} -o json --quiet > {out_dir}/grype.json
command_string: sh -c grype {image} -o json --quiet > {out_dir}/grype.json
placeholders:
  grype {image} -o json --quiet > {out_dir}/grype.json: <grype {image} -o json --quiet
    > {out_dir}/grype.json>
output_format: json_object
evidence_artifacts: &id001
- /out/grype.json
cwe_ids:
- 1395
- 200
owasp_wstg:
- WSTG-CONF-04
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: recon-passive
scenarios:
- description: Run grype against target
  example: sh -c grype {image} -o json --quiet > {out_dir}/grype.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. Anchore Grype vulnerability
  scanner — pulls {image}, derives the SBOM via bundled Syft, then matches packages
  against the Anchore vuln DB (NVD + Alpine/Debian/RH/Ubuntu/GHSA advisories). Output:
  canon'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
