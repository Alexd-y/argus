tool_id: interactsh_client
version: 1.0.0
phase: vuln_analysis
category: oast
risk_level: low
requires_approval: false
default_timeout_s: 1800
description: interactsh-client polls the ARGUS OAST plane for OOB callbacks (DNS /
  HTTP / SMTP) generated by SSRF / blind-RCE / SSTI payloads. JSONL output piped through
  sandbox/parsers/interactsh_parser.py — every callback becomes a SSRF (HTTP/SMTP=CONFIRMED)
  or INFO (DNS=LIKELY) finding with raw-request / raw-response evidence. Backlog/dev1_md
  §4.11. ARG-017.
command_template:
- interactsh-client
- -server
- https://oast.argus.local
- -json
- -o
- '{out_dir}/interactsh.jsonl'
- -v
command_string: interactsh-client -server https://oast.argus.local -json -o {out_dir}/interactsh.jsonl
  -v
placeholders:
  out_dir}/interactsh.jsonl: <out_dir}/interactsh.jsonl>
output_format: json_lines
evidence_artifacts: &id001
- /out/interactsh.jsonl
cwe_ids:
- 918
owasp_wstg:
- WSTG-INPV-19
image: argus-kali-web:latest
network_policy_name: oast-egress
scenarios:
- description: Run interactsh_client against target
  example: interactsh-client -server https://oast.argus.local -json -o {out_dir}/interactsh.jsonl
    -v
  output_type: json_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. interactsh-client polls
  the ARGUS OAST plane for OOB callbacks (DNS / HTTP / SMTP) generated by SSRF / blind-RCE
  / SSTI payloads. JSONL output piped through sandbox/parsers/interactsh_parser.py
  — ever
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
