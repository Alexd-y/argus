tool_id: syft
version: 1.0.0
phase: vuln_analysis
category: cloud
risk_level: passive
requires_approval: false
default_timeout_s: 1800
description: 'Anchore Syft SBOM generator — pulls {image} and emits a CycloneDX SBOM
  (components, dependencies, licences, origin) for downstream Grype/Trivy SCA correlation.
  Read-only, never executes container code, only inspects layers. `sh -c` is used
  solely for stdout redirection. recon-passive = TCP/443 to registries. Parser deferred
  to Cycle 3 (SBOMs are usually kept as raw evidence rather than mapped to FindingDTO).
  Author: Anchore. Backlog §4.15. ARG-018.'
command_template:
- sh
- -c
- syft {image} -o cyclonedx-json --quiet > {out_dir}/sbom.json
command_string: sh -c syft {image} -o cyclonedx-json --quiet > {out_dir}/sbom.json
placeholders:
  syft {image} -o cyclonedx-json --quiet > {out_dir}/sbom.json: <syft {image} -o cyclonedx-json
    --quiet > {out_dir}/sbom.json>
output_format: json_object
evidence_artifacts: &id001
- /out/sbom.json
cwe_ids:
- 1395
owasp_wstg:
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: recon-passive
scenarios:
- description: Run syft against target
  example: sh -c syft {image} -o cyclonedx-json --quiet > {out_dir}/sbom.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Anchore Syft SBOM generator
  — pulls {image} and emits a CycloneDX SBOM (components, dependencies, licences,
  origin) for downstream Grype/Trivy SCA correlation. Read-only, never executes container
  code
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
