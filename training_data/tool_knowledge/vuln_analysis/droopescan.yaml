tool_id: droopescan
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 1200
description: 'Droopescan multi-CMS scanner (Drupal/Joomla/SilverStripe/WordPress)
  — full enumeration (-e a) of versions, themes, modules and users; JSON output, 8
  threads. Author: droope (https://github.com/SamJoan/droopescan). Backlog/dev1_md
  §4.7.'
command_template:
- droopescan
- scan
- --url
- '{url}'
- --enumerate
- a
- --output
- json
- --threads
- '8'
- --output-file
- '{out_dir}/droopescan.json'
command_string: droopescan scan --url {url} --enumerate a --output json --threads
  8 --output-file {out_dir}/droopescan.json
placeholders:
  url: https://target.example.com
  out_dir}/droopescan.json: <out_dir}/droopescan.json>
output_format: json_object
evidence_artifacts: &id001
- /out/droopescan.json
cwe_ids:
- 1395
- 200
owasp_wstg:
- WSTG-INFO-08
- WSTG-CONF-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run droopescan against target
  example: droopescan scan --url {url} --enumerate a --output json --threads 8 --output-file
    {out_dir}/droopescan.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. Droopescan multi-CMS
  scanner (Drupal/Joomla/SilverStripe/WordPress) — full enumeration (-e a) of versions,
  themes, modules and users; JSON output, 8 threads. Author: droope (https://github.com/SamJoan'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
