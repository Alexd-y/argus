tool_id: secretfinder
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: passive
requires_approval: false
default_timeout_s: 300
description: 'SecretFinder scans JavaScript bundles listed in `{in_dir}/js.txt` for
  hard-coded API keys, tokens and credentials. Image-side wrapper `secretfinder-wrapper`
  translates argv-form (`-i <js.txt> -o cli -out <path>`) to upstream invocation and
  coerces SecretFinder''s HTML output → one secret per line at `/out/secretfinder.txt`
  so the sandbox stays argv-only. Full secret regex extraction parser ships in Cycle
  3. Author: m4ll0k (https://github.com/m4ll0k/SecretFinder). Backlog/dev1_md §4.6.'
command_template:
- secretfinder-wrapper
- -i
- '{in_dir}/js.txt'
- -o
- cli
- -out
- '{out_dir}/secretfinder.txt'
command_string: secretfinder-wrapper -i {in_dir}/js.txt -o cli -out {out_dir}/secretfinder.txt
placeholders:
  in_dir}/js.txt: <in_dir}/js.txt>
  out_dir}/secretfinder.txt: <out_dir}/secretfinder.txt>
output_format: text_lines
evidence_artifacts: &id001
- /out/secretfinder.txt
cwe_ids:
- 200
owasp_wstg:
- WSTG-INFO-05
- WSTG-CRYP-03
image: argus-kali-web:latest
network_policy_name: recon-passive
scenarios:
- description: Run secretfinder against target
  example: secretfinder-wrapper -i {in_dir}/js.txt -o cli -out {out_dir}/secretfinder.txt
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. SecretFinder scans JavaScript
  bundles listed in `{in_dir}/js.txt` for hard-coded API keys, tokens and credentials.
  Image-side wrapper `secretfinder-wrapper` translates argv-form (`-i <js.txt> -o
  cli -
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
