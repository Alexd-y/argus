tool_id: graphql_cop
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 900
description: 'graphql-cop GraphQL security audit — runs ~15 safety checks against
  {url}/graphql (introspection on, field suggestions, alias-based DoS, batch queries,
  GET-based mutation, missing CSRF, etc.) and emits a JSON report. Non-destructive,
  sends only benign reflection queries. `sh -c` is used solely to redirect stdout
  to {out_dir}; templating keeps everything argv-only. Parser deferred to Cycle 3.
  Author: dolevf. Backlog §4.14. ARG-018.'
command_template:
- sh
- -c
- graphql-cop -t {url}/graphql -o json > {out_dir}/graphqlcop.json
command_string: sh -c graphql-cop -t {url}/graphql -o json > {out_dir}/graphqlcop.json
placeholders:
  graphql-cop -t {url}/graphql -o json > {out_dir}/graphqlcop.json: <graphql-cop -t
    {url}/graphql -o json > {out_dir}/graphqlcop.json>
output_format: json_object
evidence_artifacts: &id001
- /out/graphqlcop.json
cwe_ids:
- 200
- 285
- 770
- 1284
owasp_wstg:
- WSTG-INFO-08
- WSTG-CONF-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run graphql_cop against target
  example: sh -c graphql-cop -t {url}/graphql -o json > {out_dir}/graphqlcop.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. graphql-cop GraphQL
  security audit — runs ~15 safety checks against {url}/graphql (introspection on,
  field suggestions, alias-based DoS, batch queries, GET-based mutation, missing CSRF,
  etc.) and emit
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
