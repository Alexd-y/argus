tool_id: skipfish
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: medium
requires_approval: true
default_timeout_s: 3600
description: 'skipfish active web app scanner — crawls + brute-forces {url} (5 host-conn,
  10 conn/s, 10 r/host), emits HTML report + samples. -S {wordlist} runs the wordlist
  pass (sandbox resolves to a /wordlists/ asset shipped in argus-kali-web; Backlog
  §4.8 canonical pick: /wordlists/skipfish/complete.wl). -LV shortens output paths.
  Approval-gated: aggressive crawler, may trip WAFs. Author: Michal Zalewski / Niels
  Heinen (https://github.com/spinkham/skipfish). Backlog/dev1_md §4.8.'
command_template:
- skipfish
- -o
- '{out_dir}/skipfish'
- -S
- '{wordlist}'
- -LV
- -m
- '5'
- -l
- '10'
- -t
- '10'
- -r
- '200000'
- '{url}'
command_string: skipfish -o {out_dir}/skipfish -S {wordlist} -LV -m 5 -l 10 -t 10
  -r 200000 {url}
placeholders:
  out_dir}/skipfish: <out_dir}/skipfish>
  wordlist: <wordlist>
  url: https://target.example.com
output_format: text_lines
evidence_artifacts: &id001
- /out/skipfish/index.html
- /out/skipfish/samples.txt
cwe_ids:
- 79
- 22
- 200
- 16
owasp_wstg:
- WSTG-INPV-01
- WSTG-AUTHZ-01
- WSTG-CONF-04
- WSTG-INFO-08
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run skipfish against target
  example: skipfish -o {out_dir}/skipfish -S {wordlist} -LV -m 5 -l 10 -t 10 -r 200000
    {url}
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. skipfish active web
  app scanner — crawls + brute-forces {url} (5 host-conn, 10 conn/s, 10 r/host), emits
  HTML report + samples. -S {wordlist} runs the wordlist pass (sandbox resolves to
  a /wordlists/ '
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
