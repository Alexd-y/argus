tool_id: checkov
version: 1.0.0
phase: vuln_analysis
category: iac
risk_level: passive
requires_approval: false
default_timeout_s: 1800
description: 'Bridgecrew Checkov IaC static analyser — scans the IaC bundle at {path}
  (Terraform, CloudFormation, ARM, K8s manifests, Helm, Dockerfile, Serverless) against
  the bundled policy library (CIS, AWS/Azure/GCP best-practice, secret detection,
  supply-chain). Fully offline (offline-no-egress); Checkov ships its policy DB in-image.
  `sh -c` is used solely for stdout redirection. Parser deferred to Cycle 3. Author:
  Bridgecrew/PAN. Backlog §4.15. ARG-018.'
command_template:
- sh
- -c
- checkov -d {path} -o json --quiet > {out_dir}/checkov.json
command_string: sh -c checkov -d {path} -o json --quiet > {out_dir}/checkov.json
placeholders:
  checkov -d {path} -o json --quiet > {out_dir}/checkov.json: <checkov -d {path} -o
    json --quiet > {out_dir}/checkov.json>
output_format: json_object
evidence_artifacts: &id001
- /out/checkov.json
cwe_ids:
- 16
- 200
- 285
- 311
- 732
- 798
owasp_wstg:
- WSTG-CONF-04
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: offline-no-egress
scenarios:
- description: Run checkov against target
  example: sh -c checkov -d {path} -o json --quiet > {out_dir}/checkov.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Bridgecrew Checkov IaC
  static analyser — scans the IaC bundle at {path} (Terraform, CloudFormation, ARM,
  K8s manifests, Helm, Dockerfile, Serverless) against the bundled policy library
  (CIS, AWS/Azure
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
