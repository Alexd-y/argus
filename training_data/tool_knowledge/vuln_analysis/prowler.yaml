tool_id: prowler
version: 1.0.0
phase: vuln_analysis
category: cloud
risk_level: medium
requires_approval: true
default_timeout_s: 3600
description: 'Prowler AWS posture scan — runs the full curated AWS check suite (CIS/NIST/PCI/SOC2
  packs) against {profile} and emits canonical JSON. Approval-gated: even read-only
  execution uses live AWS credentials, enumerates IAM/CloudTrail/S3 metadata and produces
  auditable cross-account API noise. recon-passive = broad TCP/443 to AWS; production
  should pin a dedicated `cloud-aws` policy (deferred to Cycle 4). Parser deferred
  to Cycle 3. Author: Prowler team. Backlog §4.15. ARG-018.'
command_template:
- prowler
- aws
- -M
- json
- -o
- '{out_dir}/prowler.json'
- --profile
- '{profile}'
command_string: prowler aws -M json -o {out_dir}/prowler.json --profile {profile}
placeholders:
  out_dir}/prowler.json: <out_dir}/prowler.json>
  profile: <profile>
output_format: json_object
evidence_artifacts: &id001
- /out/prowler.json
cwe_ids:
- 16
- 200
- 285
- 732
- 1395
owasp_wstg:
- WSTG-CONF-04
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: recon-passive
scenarios:
- description: Run prowler against target
  example: prowler aws -M json -o {out_dir}/prowler.json --profile {profile}
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. Prowler AWS posture
  scan — runs the full curated AWS check suite (CIS/NIST/PCI/SOC2 packs) against {profile}
  and emits canonical JSON. Approval-gated: even read-only execution uses live AWS
  credential'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
