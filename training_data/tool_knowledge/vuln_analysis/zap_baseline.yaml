tool_id: zap_baseline
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 1800
description: 'OWASP ZAP baseline.py — passive-only scan of {url} (no active payloads),
  25 min cap, JSON + HTML + XML reports. Spider + passive scan rules, no probe injection.
  -d emits debug log. NOTE: dedicated JSON parser deferred to Cycle 3 — parse_strategy
  stays text_lines so dispatch is honest about not extracting findings yet (raw reports
  still land in evidence). Author: OWASP ZAP (https://www.zaproxy.org/docs/docker/baseline-scan/).
  Backlog/dev1_md §4.8.'
command_template:
- zap-baseline.py
- -t
- '{url}'
- -J
- '{out_dir}/zap_baseline.json'
- -r
- '{out_dir}/zap_baseline.html'
- -x
- '{out_dir}/zap_baseline.xml'
- -T
- '25'
- -z
- -config api.disablekey=true
- -d
command_string: zap-baseline.py -t {url} -J {out_dir}/zap_baseline.json -r {out_dir}/zap_baseline.html
  -x {out_dir}/zap_baseline.xml -T 25 -z -config api.disablekey=true -d
placeholders:
  url: https://target.example.com
  out_dir}/zap_baseline.json: <out_dir}/zap_baseline.json>
  out_dir}/zap_baseline.html: <out_dir}/zap_baseline.html>
  out_dir}/zap_baseline.xml: <out_dir}/zap_baseline.xml>
output_format: text_lines
evidence_artifacts: &id001
- /out/zap_baseline.json
- /out/zap_baseline.html
- /out/zap_baseline.xml
cwe_ids:
- 16
- 200
- 693
- 1021
owasp_wstg:
- WSTG-CONF-04
- WSTG-CONF-07
- WSTG-INFO-08
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run zap_baseline against target
  example: zap-baseline.py -t {url} -J {out_dir}/zap_baseline.json -r {out_dir}/zap_baseline.html
    -x {out_dir}/zap_baseline.xml -T 25 -z -config api.disablekey=true -d
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. OWASP ZAP baseline.py
  — passive-only scan of {url} (no active payloads), 25 min cap, JSON + HTML + XML
  reports. Spider + passive scan rules, no probe injection. -d emits debug log. NOTE:
  dedicated JSO'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
