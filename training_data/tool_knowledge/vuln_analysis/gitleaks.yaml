tool_id: gitleaks
version: 1.0.0
phase: vuln_analysis
category: misc
risk_level: passive
requires_approval: false
default_timeout_s: 1800
description: 'Gitleaks git-history secret scanner — sweeps the repo at {path} (/in)
  using 100+ bundled regex+entropy rules (AWS keys, GCP SA JSON, Stripe/Twilio/GitHub
  PATs, JWTs, generic high-entropy strings). --exit-code 0 keeps successful scans
  from being marked failure on hits. Fully offline (offline-no-egress); reads local
  filesystem only. Parser deferred to Cycle 3. Author: Zachary Rice. Backlog §4.16.
  ARG-018.'
command_template:
- gitleaks
- detect
- -s
- '{path}'
- -r
- '{out_dir}/gitleaks.json'
- -f
- json
- --no-banner
- --exit-code
- '0'
command_string: gitleaks detect -s {path} -r {out_dir}/gitleaks.json -f json --no-banner
  --exit-code 0
placeholders:
  path: <path>
  out_dir}/gitleaks.json: <out_dir}/gitleaks.json>
output_format: json_object
evidence_artifacts: &id001
- /out/gitleaks.json
cwe_ids:
- 200
- 312
- 522
- 798
owasp_wstg:
- WSTG-ATHN-06
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: offline-no-egress
scenarios:
- description: Run gitleaks against target
  example: gitleaks detect -s {path} -r {out_dir}/gitleaks.json -f json --no-banner
    --exit-code 0
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Gitleaks git-history
  secret scanner — sweeps the repo at {path} (/in) using 100+ bundled regex+entropy
  rules (AWS keys, GCP SA JSON, Stripe/Twilio/GitHub PATs, JWTs, generic high-entropy
  strings). --e
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
