tool_id: mobsf_api
version: 1.0.0
phase: vuln_analysis
category: binary
risk_level: low
requires_approval: false
default_timeout_s: 1800
description: Mobile Security Framework (MoBSF) CLI — static analysis of an Android
  APK / iOS IPA binary loaded from {binary} (sandbox-rooted /in/-prefixed path). Decompiles
  bytecode, walks AndroidManifest / Info.plist, runs the MoBSF rule pack, and emits
  a JSON report. Pure offline analysis — egress fully blocked. Parser deferred to
  Cycle 3. Backlog/dev1_md §4.18. ARG-019.
command_template:
- sh
- -c
- mobsf-cli --apk {binary} --output {out_dir}/mobsf.json
command_string: sh -c mobsf-cli --apk {binary} --output {out_dir}/mobsf.json
placeholders:
  mobsf-cli --apk {binary} --output {out_dir}/mobsf.json: <mobsf-cli --apk {binary}
    --output {out_dir}/mobsf.json>
output_format: json_object
evidence_artifacts: &id001
- /out/mobsf.json
cwe_ids:
- 250
- 312
- 502
- 798
owasp_wstg:
- WSTG-INFO-08
image: argus-kali-binary:latest
network_policy_name: offline-no-egress
scenarios:
- description: Run mobsf_api against target
  example: sh -c mobsf-cli --apk {binary} --output {out_dir}/mobsf.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Mobile Security Framework
  (MoBSF) CLI — static analysis of an Android APK / iOS IPA binary loaded from {binary}
  (sandbox-rooted /in/-prefixed path). Decompiles bytecode, walks AndroidManifest
  / Info.p
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
