tool_id: jenkins_enum
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 600
description: 'Jenkins enumeration & exposure check — runs nuclei with the `jenkins`
  tag against {url}. Detects unauthenticated script console, /asynchPeople, exposed
  credentials, and known plugin RCEs. Parser handled by ARG-015 (nuclei_jsonl strategy).
  Backlog/dev1_md §4.7. Templates: https://github.com/projectdiscovery/nuclei-templates'
command_template:
- nuclei
- -target
- '{url}'
- -tags
- jenkins
- -severity
- info,low,medium,high,critical
- -jsonl
- -output
- '{out_dir}/jenkins_enum.jsonl'
- -disable-update-check
- -no-color
- -rate-limit
- '50'
- -c
- '10'
- -stats
command_string: nuclei -target {url} -tags jenkins -severity info,low,medium,high,critical
  -jsonl -output {out_dir}/jenkins_enum.jsonl -disable-update-check -no-color -rate-limit
  50 -c 10 -stats
placeholders:
  url: https://target.example.com
  out_dir}/jenkins_enum.jsonl: <out_dir}/jenkins_enum.jsonl>
output_format: nuclei_jsonl
evidence_artifacts: &id001
- /out/jenkins_enum.jsonl
cwe_ids:
- 200
- 287
- 1395
owasp_wstg:
- WSTG-CONF-04
- WSTG-INFO-08
- WSTG-ATHN-01
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run jenkins_enum against target
  example: nuclei -target {url} -tags jenkins -severity info,low,medium,high,critical
    -jsonl -output {out_dir}/jenkins_enum.jsonl -disable-update-check -no-color -rate-limit
    50 -c 10 -stats
  output_type: nuclei_jsonl
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Jenkins enumeration
  & exposure check — runs nuclei with the `jenkins` tag against {url}. Detects unauthenticated
  script console, /asynchPeople, exposed credentials, and known plugin RCEs. Parser
  handl
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
