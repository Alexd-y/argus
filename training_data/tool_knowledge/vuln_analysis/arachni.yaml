tool_id: arachni
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: medium
requires_approval: true
default_timeout_s: 3600
description: 'Arachni full-featured web application security scanner — crawls {url}
  (subdomain scope, 500 page cap), runs the complete check set, writes binary AFR
  report. Approval-gated due to active payload injection (XSS, SQLi, RCE checks fire
  real probes). Convert AFR → JSON via ''arachni_reporter'' for finding extraction
  in Cycle 3 follow-up. Author: Tasos Laskos (https://github.com/Arachni/arachni).
  Backlog/dev1_md §4.8.'
command_template:
- arachni
- '{url}'
- --scope-include-subdomains
- --scope-page-limit
- '500'
- --http-request-concurrency
- '10'
- --report-save-path
- '{out_dir}/arachni.afr'
- --checks=*
- --timeout
- 00:25:00
command_string: arachni {url} --scope-include-subdomains --scope-page-limit 500 --http-request-concurrency
  10 --report-save-path {out_dir}/arachni.afr --checks=* --timeout 00:25:00
placeholders:
  url: https://target.example.com
  out_dir}/arachni.afr: <out_dir}/arachni.afr>
output_format: text_lines
evidence_artifacts: &id001
- /out/arachni.afr
cwe_ids:
- 79
- 89
- 22
- 78
- 200
- 287
owasp_wstg:
- WSTG-INPV-01
- WSTG-INPV-05
- WSTG-INPV-12
- WSTG-AUTHZ-01
- WSTG-CONF-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run arachni against target
  example: arachni {url} --scope-include-subdomains --scope-page-limit 500 --http-request-concurrency
    10 --report-save-path {out_dir}/arachni.afr --checks=* --timeout 00:25:00
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Arachni full-featured
  web application security scanner — crawls {url} (subdomain scope, 500 page cap),
  runs the complete check set, writes binary AFR report. Approval-gated due to active
  payload injec
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
