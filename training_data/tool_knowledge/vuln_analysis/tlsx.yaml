tool_id: tlsx
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 600
description: ProjectDiscovery tlsx fast TLS handshake summary (cert chain, SAN, protocol,
  JARM) for one host:port. Backlog/dev1_md §4.3.
command_template:
- tlsx
- -host
- '{host}'
- -port
- '{port}'
- -json
- -o
- '{out_dir}/tlsx.json'
command_string: tlsx -host {host} -port {port} -json -o {out_dir}/tlsx.json
placeholders:
  host: target.example.com
  port: '443'
  out_dir}/tlsx.json: <out_dir}/tlsx.json>
output_format: json_object
evidence_artifacts: &id001
- /out/tlsx.json
cwe_ids:
- 326
- 295
owasp_wstg:
- WSTG-CRYP-01
- WSTG-CRYP-03
image: argus-kali-web:latest
network_policy_name: tls-handshake
scenarios:
- description: Run tlsx against target
  example: tlsx -host {host} -port {port} -json -o {out_dir}/tlsx.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. ProjectDiscovery tlsx
  fast TLS handshake summary (cert chain, SAN, protocol, JARM) for one host:port.
  Backlog/dev1_md §4.3.
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
