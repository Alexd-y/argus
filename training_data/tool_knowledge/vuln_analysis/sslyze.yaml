tool_id: sslyze
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 900
description: sslyze structured TLS scan covering protocol support, cipher suites,
  certificate chain, and known TLS vulnerabilities. Backlog/dev1_md §4.3.
command_template:
- sslyze
- --json_out
- '{out_dir}/sslyze.json'
- '{host}:{port}'
command_string: sslyze --json_out {out_dir}/sslyze.json {host}:{port}
placeholders:
  out_dir}/sslyze.json: <out_dir}/sslyze.json>
  host}:{port: <host}:{port>
output_format: json_object
evidence_artifacts: &id001
- /out/sslyze.json
cwe_ids:
- 326
- 327
- 295
owasp_wstg:
- WSTG-CRYP-01
- WSTG-CRYP-02
image: argus-kali-web:latest
network_policy_name: tls-handshake
scenarios:
- description: Run sslyze against target
  example: sslyze --json_out {out_dir}/sslyze.json {host}:{port}
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. sslyze structured TLS
  scan covering protocol support, cipher suites, certificate chain, and known TLS
  vulnerabilities. Backlog/dev1_md §4.3.
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
