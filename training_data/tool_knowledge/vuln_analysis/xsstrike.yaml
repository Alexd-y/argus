tool_id: xsstrike
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 600
description: 'XSStrike polyglot XSS scanner — /usr/local/bin/xsstrike-runner wraps
  upstream xsstrike.py, runs --crawl with WAF detection + blind payload generation
  against {url}, --skip-poc disables auto-POC injection, writes JSON envelope to {out_dir}/xsstrike.json.
  Approval-free passive XSS surface mapper. Parsing deferred to Cycle 3 (JSON_OBJECT
  → parsers.dispatch.unmapped_tool). Author: s0md3v (https://github.com/s0md3v/XSStrike).
  Backlog/dev1_md §4.10. ARG-016.'
command_template:
- xsstrike-runner
- --url
- '{url}'
- --crawl
- --skip-poc
- --output
- '{out_dir}/xsstrike.json'
command_string: xsstrike-runner --url {url} --crawl --skip-poc --output {out_dir}/xsstrike.json
placeholders:
  url: https://target.example.com
  out_dir}/xsstrike.json: <out_dir}/xsstrike.json>
output_format: json_object
evidence_artifacts: &id001
- /out/xsstrike.json
cwe_ids:
- 79
- 80
owasp_wstg:
- WSTG-INPV-01
- WSTG-INPV-02
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run xsstrike against target
  example: xsstrike-runner --url {url} --crawl --skip-poc --output {out_dir}/xsstrike.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. XSStrike polyglot XSS
  scanner — /usr/local/bin/xsstrike-runner wraps upstream xsstrike.py, runs --crawl
  with WAF detection + blind payload generation against {url}, --skip-poc disables
  auto-POC inject
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
