tool_id: joomscan
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 1200
description: 'OWASP JoomScan Joomla security scanner — enumerates components (--ec),
  vulnerable extensions, configuration leaks; emits text-only report. Author: OWASP
  JoomScan project (https://github.com/OWASP/joomscan). Backlog/dev1_md §4.7.'
command_template:
- joomscan
- --url
- '{url}'
- --ec
- --report
- '{out_dir}/joomscan.txt'
command_string: joomscan --url {url} --ec --report {out_dir}/joomscan.txt
placeholders:
  url: https://target.example.com
  out_dir}/joomscan.txt: <out_dir}/joomscan.txt>
output_format: text_lines
evidence_artifacts: &id001
- /out/joomscan.txt
cwe_ids:
- 1395
- 200
owasp_wstg:
- WSTG-INFO-08
- WSTG-CONF-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run joomscan against target
  example: joomscan --url {url} --ec --report {out_dir}/joomscan.txt
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. OWASP JoomScan Joomla
  security scanner — enumerates components (--ec), vulnerable extensions, configuration
  leaks; emits text-only report. Author: OWASP JoomScan project (https://github.com/OWASP/joom'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
