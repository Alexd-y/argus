tool_id: tfsec
version: 1.0.0
phase: vuln_analysis
category: iac
risk_level: passive
requires_approval: false
default_timeout_s: 1200
description: 'Aqua tfsec Terraform static analyser — scans the Terraform module tree
  at {path} with the bundled rule set (AWS/Azure/GCP/GitHub/Cloudflare/K8s/DO providers).
  --soft-fail keeps exit-code 0 so the sandbox driver never marks a successful scan
  as failure on policy hits. Fully offline (offline-no-egress); rules are in-image.
  `sh -c` is used solely for stdout redirection. Parser deferred to Cycle 3. Author:
  Aqua. Backlog §4.16. ARG-018.'
command_template:
- sh
- -c
- tfsec {path} --format json --soft-fail > {out_dir}/tfsec.json
command_string: sh -c tfsec {path} --format json --soft-fail > {out_dir}/tfsec.json
placeholders:
  tfsec {path} --format json --soft-fail > {out_dir}/tfsec.json: <tfsec {path} --format
    json --soft-fail > {out_dir}/tfsec.json>
output_format: json_object
evidence_artifacts: &id001
- /out/tfsec.json
cwe_ids:
- 16
- 200
- 285
- 311
- 732
- 798
owasp_wstg:
- WSTG-CONF-04
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: offline-no-egress
scenarios:
- description: Run tfsec against target
  example: sh -c tfsec {path} --format json --soft-fail > {out_dir}/tfsec.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
