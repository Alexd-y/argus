  static analyser — scans the Terraform module tree at {path} with the bundled rule
  set (AWS/Azure/GCP/GitHub/Cloudflare/K8s/DO providers). --soft-fail keeps exit-code
  0 so the sand
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
