tool_id: nosqlmap
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: medium
requires_approval: true
default_timeout_s: 900
description: 'NoSQLMap Mongo/CouchDB injection probe — /usr/local/bin/nosqlmap-runner
  wraps upstream nosqlmap.py (menu-driven, driven non-interactively), runs attack
  profile 2 (NoSQLi enum) against {url}, captures stdout to {out_dir}/nosqlmap.txt.
  APPROVAL REQUIRED: fires NoSQLi payloads, attempts auth-bypass, enumerates collections.
  Parsing deferred to Cycle 3 (TEXT_LINES → parsers.dispatch.unmapped_tool). Author:
  codingo (https://github.com/codingo/NoSQLMap). Backlog/dev1_md §4.9. ARG-016.'
command_template:
- nosqlmap-runner
- --target
- '{url}'
- --attack
- '2'
- --output
- '{out_dir}/nosqlmap.txt'
command_string: nosqlmap-runner --target {url} --attack 2 --output {out_dir}/nosqlmap.txt
placeholders:
  url: https://target.example.com
  out_dir}/nosqlmap.txt: <out_dir}/nosqlmap.txt>
output_format: text_lines
evidence_artifacts: &id001
- /out/nosqlmap.txt
cwe_ids:
- 943
- 89
owasp_wstg:
- WSTG-INPV-05
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run nosqlmap against target
  example: nosqlmap-runner --target {url} --attack 2 --output {out_dir}/nosqlmap.txt
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. NoSQLMap Mongo/CouchDB
  injection probe — /usr/local/bin/nosqlmap-runner wraps upstream nosqlmap.py (menu-driven,
  driven non-interactively), runs attack profile 2 (NoSQLi enum) against {url}, captures '
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
