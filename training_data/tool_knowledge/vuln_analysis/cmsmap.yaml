tool_id: cmsmap
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 1200
description: 'CMSmap multi-CMS scanner (WordPress/Joomla/Drupal/Moodle) — force-detect
  mode (-F), full plugin/theme enumeration; text-only report. Author: Dionach (https://github.com/Dionach/CMSmap).
  Backlog/dev1_md §4.7.'
command_template:
- cmsmap
- '{url}'
- -F
- -o
- '{out_dir}/cmsmap.txt'
command_string: cmsmap {url} -F -o {out_dir}/cmsmap.txt
placeholders:
  url: https://target.example.com
  out_dir}/cmsmap.txt: <out_dir}/cmsmap.txt>
output_format: text_lines
evidence_artifacts: &id001
- /out/cmsmap.txt
cwe_ids:
- 1395
- 200
owasp_wstg:
- WSTG-INFO-08
- WSTG-CONF-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run cmsmap against target
  example: cmsmap {url} -F -o {out_dir}/cmsmap.txt
  output_type: text_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. CMSmap multi-CMS scanner
  (WordPress/Joomla/Drupal/Moodle) — force-detect mode (-F), full plugin/theme enumeration;
  text-only report. Author: Dionach (https://github.com/Dionach/CMSmap). Backlog/dev1_m'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
