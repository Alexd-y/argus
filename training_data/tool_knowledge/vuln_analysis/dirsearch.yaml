tool_id: dirsearch
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 600
description: 'dirsearch directory / file discovery with extension fuzzing, JSON output.
  Author: maurosoria (https://github.com/maurosoria/dirsearch). Backlog/dev1_md §4.5.'
command_template:
- dirsearch
- -u
- '{url}'
- -e
- php,aspx,js,html
- -o
- '{out_dir}/dirsearch.json'
- --format
- json
command_string: dirsearch -u {url} -e php,aspx,js,html -o {out_dir}/dirsearch.json
  --format json
placeholders:
  url: https://target.example.com
  out_dir}/dirsearch.json: <out_dir}/dirsearch.json>
output_format: json_object
evidence_artifacts: &id001
- /out/dirsearch.json
cwe_ids:
- 200
owasp_wstg:
- WSTG-CONFIG-04
- WSTG-CONFIG-06
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run dirsearch against target
  example: dirsearch -u {url} -e php,aspx,js,html -o {out_dir}/dirsearch.json --format
    json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: 'Vulnerability identification and analysis phase. dirsearch directory
  / file discovery with extension fuzzing, JSON output. Author: maurosoria (https://github.com/maurosoria/dirsearch).
  Backlog/dev1_md §4.5.'
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
