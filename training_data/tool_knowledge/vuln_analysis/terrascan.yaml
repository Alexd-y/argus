tool_id: terrascan
version: 1.0.0
phase: vuln_analysis
category: iac
risk_level: passive
requires_approval: false
default_timeout_s: 1200
description: 'Tenable Terrascan IaC scanner — analyses the Terraform module tree at
  {path} (under /in) using the bundled OPA / Rego policy library (CIS, AWS / Azure
  / GCP / k8s benchmarks). Fully offline (offline-no-egress) — Terrascan ships its
  full policy DB inside the image. Wrapped in `sh -c` for stdout redirection. Parser
  deferred to Cycle 3 (JSON_OBJECT → parsers.dispatch.unmapped_tool). Author: Tenable
  / Accurics (https://github.com/tenable/terrascan). Backlog/dev1_md §4.16. ARG-018.'
command_template:
- sh
- -c
- terrascan scan -i terraform -d {path} -o json > {out_dir}/terrascan.json
command_string: sh -c terrascan scan -i terraform -d {path} -o json > {out_dir}/terrascan.json
placeholders:
  terrascan scan -i terraform -d {path} -o json > {out_dir}/terrascan.json: <terrascan
    scan -i terraform -d {path} -o json > {out_dir}/terrascan.json>
output_format: json_object
evidence_artifacts: &id001
- /out/terrascan.json
