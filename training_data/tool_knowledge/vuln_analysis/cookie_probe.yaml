tool_id: cookie_probe
version: 1.0.0
phase: vuln_analysis
category: browser
risk_level: low
requires_approval: false
default_timeout_s: 600
description: Headless cookie attribute auditor — drives the {url} login / landing
  flow with Chromium and inspects every Set-Cookie header for Secure / HttpOnly /
  SameSite / Domain / Path / Max-Age. Flags session cookies missing Secure on HTTPS,
  missing HttpOnly on session ids, SameSite=None without Secure, and overly-broad
  Domain / Path scopes. No mutation of the target's cookie store — pure observation.
  Parser deferred to Cycle 3. Backlog/dev1_md §4.19. ARG-019.
command_template:
- sh
- -c
- cookie-probe --url {url} --output {out_dir}/cookies.json
command_string: sh -c cookie-probe --url {url} --output {out_dir}/cookies.json
placeholders:
  cookie-probe --url {url} --output {out_dir}/cookies.json: <cookie-probe --url {url}
    --output {out_dir}/cookies.json>
output_format: json_object
evidence_artifacts: &id001
- /out/cookies.json
