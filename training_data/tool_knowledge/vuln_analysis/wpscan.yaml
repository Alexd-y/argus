tool_id: wpscan
version: 1.0.0
phase: vuln_analysis
category: web_va
risk_level: low
requires_approval: false
default_timeout_s: 1800
description: 'WPScan WordPress security scanner — enumerates vulnerable plugins/themes
  (vp,vt) and users (u), random UA, mixed (passive+aggressive) detection. Reads optional
  WPSCAN_API_TOKEN from sandbox env for CVE / WPVulnDB lookups. Author: WPScan team
  (https://github.com/wpscanteam/wpscan). Backlog/dev1_md §4.7. §4.7 backlog narrows
  enumeration scope: vp,vt retained, u added (parser handles users[*] first-class),
  tt/cb/dbe omitted (timthumb deprecated since 2014, cb/dbe noisy and rarely actionable).'
command_template:
- wpscan
- --url
- '{url}'
- --enumerate
- vp,vt,u
- --random-user-agent
- --detection-mode
- mixed
- --no-banner
- --no-update
- --disable-tls-checks
- --format
- json
- --output
- '{out_dir}/wpscan.json'
command_string: wpscan --url {url} --enumerate vp,vt,u --random-user-agent --detection-mode
  mixed --no-banner --no-update --disable-tls-checks --format json --output {out_dir}/wpscan.json
placeholders:
  url: https://target.example.com
  out_dir}/wpscan.json: <out_dir}/wpscan.json>
output_format: json_object
evidence_artifacts: &id001
- /out/wpscan.json
cwe_ids:
- 1395
- 200
owasp_wstg:
- WSTG-INFO-08
- WSTG-CONF-04
image: argus-kali-web:latest
network_policy_name: recon-active-tcp
scenarios:
- description: Run wpscan against target
  example: wpscan --url {url} --enumerate vp,vt,u --random-user-agent --detection-mode
    mixed --no-banner --no-update --disable-tls-checks --format json --output {out_dir}/wpscan.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. WPScan WordPress security
  scanner — enumerates vulnerable plugins/themes (vp,vt) and users (u), random UA,
  mixed (passive+aggressive) detection. Reads optional WPSCAN_API_TOKEN from sandbox
  env for CV
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
