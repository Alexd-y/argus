tool_id: trufflehog
version: 1.0.0
phase: vuln_analysis
category: misc
risk_level: passive
requires_approval: false
default_timeout_s: 1800
description: 'Truffle Security trufflehog secret scanner — sweeps the source tree
  at {path} (/in) using ~750 detectors. --no-verification keeps the pod fully offline
  (no live API hits to confirm a candidate token); --no-update prevents detector pulls.
  Output: one JSON document per line (json_lines). `sh -c` is used solely for stdout
  redirection. Parser deferred to Cycle 3. Author: Truffle Security. Backlog §4.16.
  ARG-018.'
command_template:
- sh
- -c
- trufflehog filesystem {path} --json --no-update --no-verification > {out_dir}/trufflehog.json
command_string: sh -c trufflehog filesystem {path} --json --no-update --no-verification
  > {out_dir}/trufflehog.json
placeholders:
  trufflehog filesystem {path} --json --no-update --no-verification > {out_dir}/trufflehog.json: <trufflehog
    filesystem {path} --json --no-update --no-verification > {out_dir}/trufflehog.json>
output_format: json_lines
evidence_artifacts: &id001
- /out/trufflehog.json
cwe_ids:
- 200
- 312
- 522
- 798
owasp_wstg:
- WSTG-ATHN-06
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: offline-no-egress
scenarios:
- description: Run trufflehog against target
  example: sh -c trufflehog filesystem {path} --json --no-update --no-verification
    > {out_dir}/trufflehog.json
  output_type: json_lines
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Truffle Security trufflehog
  secret scanner — sweeps the source tree at {path} (/in) using ~750 detectors. --no-verification
  keeps the pod fully offline (no live API hits to confirm a candidate token);
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
