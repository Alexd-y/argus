tool_id: detect_secrets
version: 1.0.0
phase: vuln_analysis
category: misc
risk_level: passive
requires_approval: false
default_timeout_s: 1200
description: 'Yelp detect-secrets entropy + plugin-based secret scanner — analyses
  the source tree at {path} (/in) using AWS/Azure/Slack/GitHub/Stripe/NPM/private-key
  plugins plus Shannon-entropy heuristics. Designed to seed a baseline (.secrets.baseline)
  so later runs flag only NEW leaks; this descriptor emits raw scan JSON for downstream
  baseline diffing. Fully offline (offline-no-egress). `sh -c` is used solely for
  stdout redirection. Parser deferred to Cycle 3. Author: Yelp. Backlog §4.16. ARG-018.'
command_template:
- sh
- -c
- detect-secrets scan {path} > {out_dir}/detect-secrets.json
command_string: sh -c detect-secrets scan {path} > {out_dir}/detect-secrets.json
placeholders:
  detect-secrets scan {path} > {out_dir}/detect-secrets.json: <detect-secrets scan
    {path} > {out_dir}/detect-secrets.json>
output_format: json_object
evidence_artifacts: &id001
- /out/detect-secrets.json
cwe_ids:
- 200
- 312
- 522
- 798
owasp_wstg:
- WSTG-ATHN-06
- WSTG-INFO-08
image: argus-kali-cloud:latest
network_policy_name: offline-no-egress
scenarios:
- description: Run detect_secrets against target
  example: sh -c detect-secrets scan {path} > {out_dir}/detect-secrets.json
  output_type: json_object
  next_steps:
  - Follow up with related ARGUS tools based on findings
related_tools: []
when_to_use: Vulnerability identification and analysis phase. Yelp detect-secrets
  entropy + plugin-based secret scanner — analyses the source tree at {path} (/in)
  using AWS/Azure/Slack/GitHub/Stripe/NPM/private-key plugins plus Shannon-entropy
  heuristics. Design
key_outputs: *id001
tips:
- Start with default flags, then add aggressive options for thorough scanning
