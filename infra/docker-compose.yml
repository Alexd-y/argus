# ARGUS Infrastructure — production-ready stack
# PostgreSQL, Redis, MinIO, Backend, Worker, Nginx
#
# Usage:
#   Production: docker compose -f infra/docker-compose.yml up
#   Worker image: build backend first (worker Dockerfile FROM argus-backend — not on Hub):
#     docker compose -f docker-compose.yml build backend && docker compose -f docker-compose.yml up -d --build
#   Dev: docker compose up (from infra/ — docker-compose.override.yml auto-loaded)
#
# Env: copy infra/.env.example to infra/.env (see .env.example for path)
#
# SECURITY — Default secrets (POSTGRES_*, REDIS_*, MINIO_*, JWT_SECRET):
#   Defaults are for dev convenience only. PRODUCTION MUST override via .env:
#   - Use strong unique passwords (openssl rand -hex 32)
#   - Never deploy with default values

name: argus

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: argus-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Ports: NOT exposed in production. Use docker-compose.dev.yml for dev (local DB access)
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    restart: unless-stopped
    env_file: .env
    # WARNING: If REDIS_PASSWORD is empty, Redis runs without authentication.
    # For production, always set REDIS_PASSWORD in .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - redis_data:/data
    # Ports: NOT exposed in production. Use docker-compose.override.yml for dev
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: argus-minio
    restart: unless-stopped
    env_file: .env
    # Console on fixed port so host mapping 9001:9001 (override/dev) works
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-argus}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    # Ports: NOT exposed in production. Use docker-compose.dev.yml for dev
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: mc creates S3 buckets after MinIO is healthy. The container EXITS 0 when done —
  # in Docker Desktop this looks "stopped"; that is expected (not a crash). Re-run if needed:
  #   docker compose -f infra/docker-compose.yml run --rm minio-init
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: argus-minio-init
    env_file: .env
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        until mc alias set argus http://minio:9000 $${MINIO_ACCESS_KEY:-argus} $${MINIO_SECRET_KEY} 2>/dev/null; do
          echo 'Waiting for MinIO...' && sleep 2;
        done;
        mc mb --ignore-existing argus/$${MINIO_BUCKET:-argus};
        mc mb --ignore-existing argus/$${MINIO_REPORTS_BUCKET:-argus-reports};
        mc mb --ignore-existing argus/stage1-artifacts;
        mc mb --ignore-existing argus/stage2-artifacts;
        mc mb --ignore-existing argus/stage3-artifacts;
        mc mb --ignore-existing argus/stage4-artifacts;
        mc mb --ignore-existing argus/argus-recon;
        echo 'MinIO buckets ready';
      "
    networks:
      - data
    depends_on:
      minio:
        condition: service_healthy

  whiterabbitneo:
    build:
      context: ./whiterabbitneo
      dockerfile: Dockerfile
      args:
        GPU_MODE: ${WRB_GPU_MODE:-cpu}
    image: argus-whiterabbitneo
    container_name: argus-whiterabbitneo
    restart: unless-stopped
    env_file: .env
    environment:
      VLLM_API_KEY: ${WRB_API_KEY:-argus-wrb-key}
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 12G
        reservations:
          cpus: "4.0"
          memory: 6G
    volumes:
      - wrb_models:/models
      - wrb_cache:/root/.cache/huggingface
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Первый запуск CPU: скачивание GGUF с Hugging Face (~4 GiB).
      start_period: 900s

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend/Dockerfile
    image: argus-backend
    container_name: argus-backend
    restart: unless-stopped
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-argus}
      # SECURITY (H-7): When REDIS_PASSWORD is set, REDIS_URL and CELERY_BROKER_URL
      # MUST include the password: redis://:PASSWORD@redis:6379/0
      # Defaults below assume no auth (dev). Override in .env for production.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-argus}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-argus}
      MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-argus-reports}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      # SEC-001: secure default for .env files predating REQUIRE_TENANT_AUTH.
      REQUIRE_TENANT_AUTH: "${REQUIRE_TENANT_AUTH:-true}"
      SANDBOX_ENABLED: "${SANDBOX_ENABLED:-true}"
      VA_AI_PLAN_ENABLED: "${VA_AI_PLAN_ENABLED:-false}"
      SQLMAP_VA_ENABLED: "${SQLMAP_VA_ENABLED:-false}"
      VA_EXPLOIT_AGGRESSIVE_ENABLED: "${VA_EXPLOIT_AGGRESSIVE_ENABLED:-false}"
      ACTIVE_SCAN_MAX_CONCURRENT_JOBS: ${ACTIVE_SCAN_MAX_CONCURRENT_JOBS:-10}
      ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY: ${ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY:-10}
      ACTIVE_SCAN_MAX_CAPTURE_BYTES: ${ACTIVE_SCAN_MAX_CAPTURE_BYTES:-4194304}
      VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC: ${VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC:-120}
      VA_AGGRESSIVE_SCAN: "${VA_AGGRESSIVE_SCAN:-false}"
      VA_CUSTOM_XSS_POC_ENABLED: "${VA_CUSTOM_XSS_POC_ENABLED:-true}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      VERCEL_FRONTEND_URL: ${VERCEL_FRONTEND_URL:-}
      # `-` (not `:-`): unset → default WRB; explicit empty WHITERABBITNEO_URL= disables
      # WRB so all LLM tasks (incl. analysis) use the cloud task router (no local model).
      WHITERABBITNEO_URL: ${WHITERABBITNEO_URL-http://whiterabbitneo:8000/v1}
      WHITERABBITNEO_API_KEY: ${WRB_API_KEY:-}
    volumes:
      # SECURITY: docker.sock read-only is sufficient for docker exec.
      # exec_create + exec_start are read-only daemon operations.
      # Code in sandbox_tool_runner.py only uses docker exec.
      # K8s deployment should use k8s_adapter.py instead (no socket mount).
      - ${ARGUS_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - backend
      - data
    # whiterabbitneo не в depends_on: иначе при долгой/сломанной загрузке GGUF не поднимаются
    # backend и nginx → на хосте нет API для Next.js (override: FastAPI на 127.0.0.1:8080).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-scans:
    # Workers = backend image + a different celery command (see `command:` below).
    # Use the backend image directly instead of a near-empty derived image: this
    # avoids buildkit failing to resolve the local `argus-backend` base under
    # Podman/buildx, and workers always run the exact backend code.
    image: argus-backend
    container_name: argus-worker-scans
    restart: unless-stopped
    command: celery -A src.celery_app worker -l INFO -Q argus.scans --concurrency 3
    # Docker default (uid 1000 + docker gid) accesses a root:docker socket. Rootless
    # Podman remaps the mounted podman.sock to root:root inside the userns, so tool
    # `docker exec` into argus-sandbox needs container-uid 0 (= the unprivileged host
    # user that owns the socket). Set ARGUS_WORKER_USER=0:0 on Podman hosts.
    user: "${ARGUS_WORKER_USER:-1000:${DOCKER_GID:-999}}"
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 1G
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-argus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-argus}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-argus}
      MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-argus-reports}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      SANDBOX_ENABLED: "${SANDBOX_ENABLED:-true}"
      VA_AI_PLAN_ENABLED: "${VA_AI_PLAN_ENABLED:-false}"
      SQLMAP_VA_ENABLED: "${SQLMAP_VA_ENABLED:-false}"
      VA_EXPLOIT_AGGRESSIVE_ENABLED: "${VA_EXPLOIT_AGGRESSIVE_ENABLED:-false}"
      ACTIVE_SCAN_MAX_CONCURRENT_JOBS: ${ACTIVE_SCAN_MAX_CONCURRENT_JOBS:-10}
      ACTIVE_SCAN_MAX_CAPTURE_BYTES: ${ACTIVE_SCAN_MAX_CAPTURE_BYTES:-4194304}
      VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC: ${VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC:-120}
      VA_AGGRESSIVE_SCAN: "${VA_AGGRESSIVE_SCAN:-false}"
      VA_CUSTOM_XSS_POC_ENABLED: "${VA_CUSTOM_XSS_POC_ENABLED:-true}"
      ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY: ${ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      # `-` (not `:-`): unset → default WRB; explicit empty WHITERABBITNEO_URL= disables
      # WRB so all LLM tasks (incl. analysis) use the cloud task router (no local model).
      WHITERABBITNEO_URL: ${WHITERABBITNEO_URL-http://whiterabbitneo:8000/v1}
      WHITERABBITNEO_API_KEY: ${WRB_API_KEY:-}
    volumes:
      - ${ARGUS_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - backend
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker-general:
    image: argus-backend
    restart: unless-stopped
    command: celery -A src.celery_app worker -l INFO -Q argus.tools,argus.recon,argus.exploitation,argus.default --concurrency 2
    user: "${ARGUS_WORKER_USER:-1000:${DOCKER_GID:-999}}"
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-argus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-argus}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-argus}
      MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-argus-reports}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      SANDBOX_ENABLED: "${SANDBOX_ENABLED:-true}"
      VA_AI_PLAN_ENABLED: "${VA_AI_PLAN_ENABLED:-false}"
      SQLMAP_VA_ENABLED: "${SQLMAP_VA_ENABLED:-false}"
      VA_EXPLOIT_AGGRESSIVE_ENABLED: "${VA_EXPLOIT_AGGRESSIVE_ENABLED:-false}"
      ACTIVE_SCAN_MAX_CONCURRENT_JOBS: ${ACTIVE_SCAN_MAX_CONCURRENT_JOBS:-10}
      ACTIVE_SCAN_MAX_CAPTURE_BYTES: ${ACTIVE_SCAN_MAX_CAPTURE_BYTES:-4194304}
      VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC: ${VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC:-120}
      VA_AGGRESSIVE_SCAN: "${VA_AGGRESSIVE_SCAN:-false}"
      VA_CUSTOM_XSS_POC_ENABLED: "${VA_CUSTOM_XSS_POC_ENABLED:-true}"
      ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY: ${ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      # `-` (not `:-`): unset → default WRB; explicit empty WHITERABBITNEO_URL= disables
      # WRB so all LLM tasks (incl. analysis) use the cloud task router (no local model).
      WHITERABBITNEO_URL: ${WHITERABBITNEO_URL-http://whiterabbitneo:8000/v1}
      WHITERABBITNEO_API_KEY: ${WRB_API_KEY:-}
    volumes:
      - ${ARGUS_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - backend
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-reports:
    image: argus-backend
    container_name: argus-worker-reports
    restart: unless-stopped
    command: celery -A src.celery_app worker -l INFO -Q argus.reports --concurrency 1
    user: "${ARGUS_WORKER_USER:-1000:${DOCKER_GID:-999}}"
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-argus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-argus}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-argus}
      MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-argus-reports}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      SANDBOX_ENABLED: "${SANDBOX_ENABLED:-true}"
      VA_AI_PLAN_ENABLED: "${VA_AI_PLAN_ENABLED:-false}"
      SQLMAP_VA_ENABLED: "${SQLMAP_VA_ENABLED:-false}"
      VA_EXPLOIT_AGGRESSIVE_ENABLED: "${VA_EXPLOIT_AGGRESSIVE_ENABLED:-false}"
      ACTIVE_SCAN_MAX_CONCURRENT_JOBS: ${ACTIVE_SCAN_MAX_CONCURRENT_JOBS:-10}
      ACTIVE_SCAN_MAX_CAPTURE_BYTES: ${ACTIVE_SCAN_MAX_CAPTURE_BYTES:-4194304}
      VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC: ${VA_ACTIVE_SCAN_TOOL_TIMEOUT_SEC:-120}
      VA_AGGRESSIVE_SCAN: "${VA_AGGRESSIVE_SCAN:-false}"
      VA_CUSTOM_XSS_POC_ENABLED: "${VA_CUSTOM_XSS_POC_ENABLED:-true}"
      ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY: ${ARGUS_ACTIVE_INJECTION_MAX_CONCURRENCY:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      # `-` (not `:-`): unset → default WRB; explicit empty WHITERABBITNEO_URL= disables
      # WRB so all LLM tasks (incl. analysis) use the cloud task router (no local model).
      WHITERABBITNEO_URL: ${WHITERABBITNEO_URL-http://whiterabbitneo:8000/v1}
      WHITERABBITNEO_API_KEY: ${WRB_API_KEY:-}
    networks:
      - backend
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # WB-P4b — Web Workbench Intruder high-volume attack runner.
  #
  # Dedicated pool draining ONLY `argus.intruder.highvol` so a large attack can
  # never starve the scan / report / tool queues. Every request still passes the
  # shared ForwardGate (scope) inside IntruderService; payloads are materialised
  # from the signed PayloadRegistry. Reuses the worker image (build backend +
  # worker first).
  worker-intruder:
    image: argus-backend
    container_name: argus-worker-intruder
    restart: unless-stopped
    command: celery -A src.celery_app worker -l INFO -Q argus.intruder.highvol --concurrency 2
    user: "${ARGUS_WORKER_USER:-1000:${DOCKER_GID:-999}}"
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-argus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-argus}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-argus}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      WB_EAP_KEYS_DIR: ${WB_EAP_KEYS_DIR:-/app/config/keys}
    networks:
      - backend
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Web Security Workbench intercepting proxy (WB-P2b).
  #
  # Profile-gated: a plain `docker compose up` must NOT start this — the live
  # MITM daemon (WB-P2b-2, mitmproxy addon at src.web_workbench.proxy.service)
  # is infra-gated and only exercised in E2E. Reuses the backend image, so build
  # `backend` first. Start explicitly:
  #   docker compose -f infra/docker-compose.yml --profile web-proxy up -d web-proxy
  #
  # SECURITY: the CA private key is sealed with WB_CA_SEALING_KEY (KEK) and never
  # persisted in plaintext; all forwarded traffic passes the shared ForwardGate
  # (scope + preflight + EAP) — this is not an open relay.
  web-proxy:
    # Dedicated image = argus-backend + mitmproxy (kept out of the shared images).
    # Build backend first, then this profile (COMPOSE_BAKE=false to use the local image).
    build:
      context: web-proxy
      dockerfile: Dockerfile
      args:
        BACKEND_IMAGE: argus-backend:latest
    image: argus-web-proxy
    container_name: argus-web-proxy
    profiles:
      - web-proxy
    restart: unless-stopped
    env_file: .env
    command: ["python3", "-m", "src.web_workbench.proxy.service"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-argus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-argus}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-argus}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      WB_PROXY_LISTEN_PORT: ${WB_PROXY_LISTEN_PORT:-8080}
      # KEK that seals per-listener CA private keys. Keep PRIVATE (infra/.env only).
      WB_CA_SEALING_KEY: ${WB_CA_SEALING_KEY:-}
    ports:
      - "${ARGUS_WEB_PROXY_PORT:-8081}:8080"
    networks:
      - backend
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  sandbox:
    build:
      context: ..
      dockerfile: infra/Dockerfile.sandbox
      args:
        SANDBOX_PROFILE: ${SANDBOX_PROFILE:-binary}
        INSTALL_MSF: ${INSTALL_MSF:-false}
    image: argus-sandbox
    container_name: argus-sandbox
    restart: unless-stopped
    # Long-lived idle container: workers run tools inside it via `docker exec`.
    # The image inherits Kali's default `bash` CMD which exits immediately without a
    # TTY, so the container would crash-loop — keep it alive explicitly.
    command: ["sleep", "infinity"]
    volumes:
      - ../plugins/exploit_scripts:/opt/exploit_scripts:ro
      - sandbox_tmp:/tmp/argus-sandbox
    networks:
      - data
    deploy:
      resources:
        # Workers `docker exec` active-scan tools (nuclei, dalfox, sqlmap, …) into
        # THIS container, so every concurrent tool shares this cgroup. In LAB mode
        # nuclei runs uncapped (+ headless chromium), so a 2G cap OOM-killed nuclei
        # mid-scan and dropped findings. Default raised to 12G (host has ample RAM)
        # so 4 concurrent heavy tools never hit the memcg ceiling; override with
        # SANDBOX_MEMORY_LIMIT. If OOM still occurs under many parallel scans, lower
        # ACTIVE_SCAN_MAX_CONCURRENT_JOBS (4 -> 2) as the second lever.
        limits:
          cpus: "${SANDBOX_CPU_LIMIT:-2.0}"
          memory: ${SANDBOX_MEMORY_LIMIT:-12288M}
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "id argus || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Ephemeral sandbox for fuzzing, symbolic execution, and binary analysis.
  # Uses the 'binary' profile with AFL++, angr, Z3, Jazzer, radare2, binwalk.
  # Spawned per-scan by EphemeralWorkerPool for isolated task execution.
  kali-runner:
    build:
      context: ..
      dockerfile: infra/Dockerfile.sandbox
      args:
        SANDBOX_PROFILE: binary
    image: argus-kali-runner
    container_name: argus-kali-runner
    restart: unless-stopped
    # Keep the standing container alive (EphemeralWorkerPool spawns its own per-scan
    # containers from this image; the long-lived one must not exit on Kali's bash CMD).
    command: ["sleep", "infinity"]
    volumes:
      - sandbox_tmp:/tmp/argus-sandbox
    networks:
      - data
    deploy:
      resources:
        # Ephemeral per-scan tool runner (fuzzing / symbolic / heavy exploitation).
        # Raised from 4G → 8G default so nuclei/afl/angr are not memcg-OOM-killed
        # mid-run; override with KALI_RUNNER_MEMORY_LIMIT.
        limits:
          cpus: "${KALI_RUNNER_CPU_LIMIT:-2.0}"
          memory: ${KALI_RUNNER_MEMORY_LIMIT:-8192M}
        reservations:
          cpus: "0.5"
          memory: 1024M
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "argus-tool-check || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # Adminer — lightweight web DB admin (PostgreSQL, MySQL, SQLite)
  # Admin frontend — Next.js standalone on port 6100.
  # Auto-restarts on crash; healthcheck probes /api/v1/health via backend rewrite.
  admin-frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        # Internal rewrite target baked into the bundle — always docker DNS,
        # never a public IP/domain (see Frontend/next.config.ts).
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_MCP_ENABLED: ${NEXT_PUBLIC_MCP_ENABLED:-false}
        NEXT_PUBLIC_ADMIN_AUTH_MODE: ${NEXT_PUBLIC_ADMIN_AUTH_MODE:-session}
        APP_PORT: "6100"
    image: argus-admin-frontend
    container_name: argus-admin-frontend
    restart: always
    environment:
      PORT: "6100"
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_MCP_ENABLED: ${NEXT_PUBLIC_MCP_ENABLED:-false}
      NEXT_PUBLIC_ADMIN_AUTH_MODE: ${NEXT_PUBLIC_ADMIN_AUTH_MODE:-session}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "${ARGUS_ADMIN_PORT:-6100}:6100"
    networks:
      - backend
      - frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:6100/api/v1/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Public pentest frontend — Next.js standalone on port 5000.
  # Serves the public RAGNAROK scan UI. Same image, different port.
  # NEXT_PUBLIC_ADMIN_AUTH_MODE MUST be `session` in production: the standalone
  # server's instrumentation hook (Frontend/instrumentation.ts) aborts boot
  # otherwise, and `auto`/`cookie` would let any visitor mint an admin-role
  # cookie on this internet-facing instance. The public scan UI (/, /report)
  # does not use the admin surface, so `session` has no downside here.
  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        # Internal rewrite target baked into the bundle — always docker DNS,
        # never a public IP/domain (see Frontend/next.config.ts).
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://backend:8000}
        NEXT_PUBLIC_MCP_ENABLED: ${NEXT_PUBLIC_MCP_ENABLED:-false}
        NEXT_PUBLIC_ADMIN_AUTH_MODE: ${NEXT_PUBLIC_ADMIN_AUTH_MODE:-session}
        # TEMP: disable "Verify domain ownership" during testing. Revert to false.
        NEXT_PUBLIC_DISABLE_DOMAIN_VERIFICATION: ${NEXT_PUBLIC_DISABLE_DOMAIN_VERIFICATION:-false}
        APP_PORT: "5000"
    image: argus-frontend
    container_name: argus-frontend
    # Profile-gated: the public UI is normally served on :5000 by the host (systemd
    # Next.js standalone), so a plain `docker compose up` must NOT start this container
    # — it would collide on host port 5000 (restart: always made it retry forever).
    # Start the containerized frontend explicitly only when the host port is free:
    #   docker compose --profile frontend up -d frontend
    profiles:
      - frontend
    restart: always
    environment:
      PORT: "5000"
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://backend:8000}
      NEXT_PUBLIC_MCP_ENABLED: ${NEXT_PUBLIC_MCP_ENABLED:-false}
      NEXT_PUBLIC_ADMIN_AUTH_MODE: ${NEXT_PUBLIC_ADMIN_AUTH_MODE:-session}
      # TEMP: disable "Verify domain ownership" during testing. Revert to false.
      NEXT_PUBLIC_DISABLE_DOMAIN_VERIFICATION: ${NEXT_PUBLIC_DISABLE_DOMAIN_VERIFICATION:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Server-only key the SSR proxy presents to the backend (X-API-Key). The
      # public UI talks to the backend directly (bypassing nginx), so it must
      # authenticate itself. Never exposed to the browser (no NEXT_PUBLIC_ prefix).
      BACKEND_API_KEY: ${BACKEND_API_KEY:-${ARGUS_GATEWAY_API_KEY:-${ADMIN_API_KEY:-}}}
    ports:
      - "${ARGUS_PUBLIC_PORT:-5000}:5000"
    networks:
      - backend
      - frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/v1/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  adminer:
    image: adminer:latest
    container_name: argus-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

  # Gateway: maps host HTTP(S) ports to nginx; `/api/*` → backend:8000 unchanged.
  # Frontend uses base `/api/v1` (NEXT_PUBLIC_API_URL). Reports (RPT-003/004):
  #   /api/v1/reports, /api/v1/reports/{id}/download, POST /api/v1/reports/generate,
  #   /api/v1/scans/{scan_id}/reports/generate(+all). Secrets: ARGUS_GATEWAY_API_KEY / CORS via .env only.
  nginx:
    image: nginx:1.27-alpine
    container_name: argus-nginx
    restart: unless-stopped
    env_file: .env
    # Bind-mounted script may lose +x (Windows clone, git filemode); exec via sh avoids "permission denied".
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    environment:
      # Accept either ARGUS_CORS_ALLOWED_ORIGINS (canonical) or CORS_ORIGINS
      # (used by backend FastAPI app) so the same .env value drives both layers.
      # Without this, the nginx CORS map silently falls back to the example
      # default and Vercel preflights are denied at the gateway.
      ARGUS_CORS_ALLOWED_ORIGINS: ${ARGUS_CORS_ALLOWED_ORIGINS:-${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}}
      # Optional server-side API key injection for proxied /api requests.
      # Keep this key PRIVATE (infra/.env only). Prefer a dedicated key with
      # limited scope/rate-limits; do not expose backend auth keys in frontend JS.
      ARGUS_GATEWAY_API_KEY: ${ARGUS_GATEWAY_API_KEY:-${ARGUS_API_KEYS:-}}
    ports:
      # По умолчанию не 8080: в docker-compose.override.yml dev-бэкенд публикуется на 8080 для Next.js.
      # Задайте ARGUS_HTTP_PORT=8080 только если не используете dev-override с пробросом backend.
      - "${ARGUS_HTTP_PORT:-18888}:80"
      # Default 19443: 8443/8449 often fail on Windows (Hyper-V excluded ranges).
      # TLS termination inside nginx is optional (see nginx/ssl + api-tls); port mapping preserved for HTTPS when enabled.
      - "${ARGUS_HTTPS_PORT:-19443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      # TLS material for the HTTPS admin console (self-signed or CA). Generated
      # on the host into infra/nginx/ssl; never committed (see ssl/.gitignore).
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
      - backend
    depends_on:
      backend:
        condition: service_healthy
      # nginx resolves upstream hostnames at config load; admin-frontend must be
      # started first, otherwise `nginx -t` fails ("host not found in upstream
      # admin-frontend:6100") and takes the whole gateway (incl. public API) down.
      admin-frontend:
        condition: service_started
    healthcheck:
      # Use IPv4 explicitly: BusyBox wget on Alpine resolves "localhost" to ::1
      # first and fails with "Connection refused" because nginx only binds
      # 0.0.0.0:80 (no `listen [::]:80` directive in api.conf).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Cloudflare Tunnel (remotely managed). Start only with: docker compose --profile tunnel up
  #
  # If CLOUDFLARE_TUNNEL_TOKEN is empty/unset and you enable this profile, the official cloudflared
  # image would run `tunnel run` without credentials and exit with:
  #   "cloudflared tunnel run" requires the ID or name of the tunnel
  # This service uses a thin Alpine wrapper so we validate the token first and call:
  #   cloudflared tunnel --no-autoupdate run --token <JWT>
  # Compose maps infra/.env CLOUDFLARE_TUNNEL_TOKEN → TUNNEL_TOKEN inside the container (compatible with --token).
  cloudflared:
    build:
      context: ./cloudflared
      dockerfile: Dockerfile
    image: argus-cloudflared:latest
    container_name: argus-cloudflared
    env_file: .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - frontend
    depends_on:
      nginx:
        condition: service_healthy
    profiles:
      - tunnel

  # P2: Optional message queue — uncomment to enable
  # nats:
  #   image: nats:2.10-alpine
  #   container_name: argus-nats
  #   command: ["-js"]
  #   ports:
  #     - "4222:4222"
  #     - "8222:8222"
  #   networks:
  #     - backend
  #   healthcheck:
  #     test: ["CMD-SHELL", "nats server check connection || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  # P2: Optional message queue — uncomment to enable
  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   container_name: argus-rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - backend
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "check_running"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 15s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  sandbox_tmp:
  wrb_models:
  wrb_cache:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
