# Grafana + Prometheus overlay for unified AI / RAG / LAB metrics (§18).
# Usage from repo root:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.observability.yml up -d

name: argus

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: argus-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.unified-ai.yml:/etc/prometheus/prometheus.yml:ro
      - argus_prometheus:/prometheus
    networks:
      - backend

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.2}
    container_name: argus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/argus:ro
      - argus_grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  argus_prometheus:
  argus_grafana:
