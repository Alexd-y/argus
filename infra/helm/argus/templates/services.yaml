apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-backend
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.backend.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-celery-metrics
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.celery.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-frontend
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-mcp
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.mcp.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.mcp.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
---
{{- if .Values.llmGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-llm-gateway
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.llmGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
---
{{- end }}
{{- if .Values.whiteRabbitNeo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-whiterabbitneo
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: whiterabbitneo
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: whiterabbitneo
{{- end }}
---
{{- if .Values.webProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-web-proxy
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-proxy
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.webProxy.service.proxyPort }}
      targetPort: proxy
      protocol: TCP
      name: proxy
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web-proxy
{{- end }}
