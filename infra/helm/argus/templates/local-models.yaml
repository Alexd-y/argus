{{- range $name, $cfg := .Values.localModels }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.fullname" $ }}-{{ $cfg.component }}
  labels:
    {{- include "argus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $cfg.component }}
spec:
  replicas: {{ $cfg.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $cfg.component }}
  template:
    metadata:
      labels:
        {{- include "argus.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $cfg.component }}
    spec:
      serviceAccountName: {{ include "argus.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vllm
          image: {{ $cfg.image.repository }}:{{ $cfg.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_ID
              value: {{ $cfg.modelId | default $cfg.component | quote }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" $ }}-{{ $cfg.component }}
  labels:
    {{- include "argus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $cfg.component }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $cfg.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "argus.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $cfg.component }}
{{- end }}
{{- end }}
