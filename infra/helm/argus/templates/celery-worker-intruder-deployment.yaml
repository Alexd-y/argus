{{- if .Values.webIntruder.enabled }}
{{- include "argus.cosignAssertProd" . -}}
# Web Workbench Intruder — dedicated high-volume attack worker pool (WB-P4b).
#
# Disabled by default (webIntruder.enabled=false). Drains ONLY the
# ``argus.intruder.highvol`` queue so a large attack can never starve the scan /
# report / tool queues. The live high-volume send loop is infra-gated (exercised
# only on a running stack); this manifest is the ready scaffold — enabling the
# value + pushing the celery image is all that remains. Every request still
# passes the shared ForwardGate (scope) inside IntruderService, and payloads are
# materialised from the signed PayloadRegistry (SI-5).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.fullname" . }}-celery-intruder
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-intruder
spec:
  replicas: {{ .Values.webIntruder.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-intruder
  template:
    metadata:
      labels:
        {{- include "argus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-intruder
      annotations:
        argus.image.digest/celery: {{ .Values.image.celery.digest | quote }}
    spec:
      serviceAccountName: {{ include "argus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      {{- include "argus.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "argus.cosignVerifyInit" (dict "root" $ "image" .Values.image.celery "name" "verify-celery-intruder") | nindent 8 }}
      containers:
        - name: celery-intruder
          image: {{ include "argus.imageRef" (dict "image" .Values.image.celery "root" $) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["celery"]
          args:
            - "-A"
            - "src.celery_app"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            - "argus.intruder.highvol"
            - "--concurrency={{ .Values.webIntruder.concurrency }}"
            - "--prefetch-multiplier=1"
          envFrom:
            - configMapRef:
                name: {{ include "argus.fullname" . }}-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecretName }}
                  key: {{ .Values.secrets.database.existingSecretKey }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redis.existingSecretName }}
                  key: {{ .Values.secrets.redis.existingSecretKey }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio.existingAccessSecretName }}
                  key: {{ .Values.secrets.minio.existingAccessSecretKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio.existingSecretSecretName }}
                  key: {{ .Values.secrets.minio.existingSecretSecretKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A src.celery_app inspect ping -d celery@$HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A src.celery_app inspect ping -d celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.webIntruder.resources | nindent 12 }}
          volumeMounts:
            {{- include "argus.standardVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "argus.standardVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "argus.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: celery-intruder
                topologyKey: topology.kubernetes.io/zone
        {{- end }}
{{- end }}
