# Isolated LAB runner overlay (master prompt §19.1).
# Usage from repo root:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.lab-runner.yml up -d lab-runner
#
# This container is the ONLY docker exec target for /lab/scripts and /lab/artifacts.
# It must not join backend/data networks used by postgres/redis/API.

name: argus

networks:
  lab:
    name: argus-lab
    driver: bridge

services:
  lab-runner:
    image: argus-sandbox
    container_name: argus-lab-runner
    restart: unless-stopped
    command: ["sleep", "infinity"]
    # F-H01 Stage 2/8 container hardening (mirrors the `sandbox`/`kali-runner`
    # services in docker-compose.yml). lab-runner is already network-isolated on
    # the dedicated `lab` bridge (never backend/data), so only the container-level
    # directives are added here. no-new-privileges is omitted for the same reason
    # as the sandbox: file-cap raw sockets (nmap -sS/-sU, masscan) as the non-root
    # argus user are incompatible with no_new_privs. See the sandbox service
    # comments and docs/docker-socket-hardening.md §5a.
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    environment:
      ARGUS_LAB_NAMESPACE: ${ARGUS_LAB_K8S_NAMESPACE:-argus-lab}
    labels:
      argus.dev/lab-runner: "true"
      argus.dev/lab-namespace: ${ARGUS_LAB_K8S_NAMESPACE:-argus-lab}
    volumes:
      - lab_runner_tmp:/tmp/argus-lab
    networks:
      - lab
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 512   # F-H01 Stage 2: fork-bomb cap (compose-spec form of pids_limit)
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "id argus || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lab_runner_tmp:
