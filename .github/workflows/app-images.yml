name: App Images (backend + worker + mcp → GHCR)

# =============================================================================
# .github/workflows/app-images.yml — build & push the ARGUS application images
# to GHCR so AWS (or any target) pulls ready images instead of building at
# deploy (`docker compose up` without `--build`). Complements sandbox-images.yml
# which ships the 6 Kali tool images.
#
# Images produced (ghcr.io/<owner>/…, :<sha> + :latest):
#   * argus-backend  — FastAPI API (context: backend/, file: infra/backend/Dockerfile).
#   * argus-worker   — Celery workers (context: infra/, file: infra/worker/Dockerfile,
#                      FROM ${BACKEND_IMAGE}); one image, queue/concurrency via command.
#   * argus-mcp      — the MCP server IS the backend image run with an MCP command,
#                      so it is a re-tag of argus-backend (shared layers).
#
# Consumed by infra/docker-compose.e2e.yml via ARGUS_BACKEND_IMAGE /
# ARGUS_CELERY_IMAGE / ARGUS_MCP_IMAGE. The production infra/docker-compose.yml
# keeps its build: directives; point image: at these refs to skip building.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/backend/Dockerfile'
      - 'infra/worker/Dockerfile'
      - '.github/workflows/app-images.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'infra/backend/Dockerfile'
      - 'infra/worker/Dockerfile'
      - '.github/workflows/app-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push app images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image refs (lowercased owner)
        id: refs
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "owner=${OWNER_LC}"
            echo "backend=ghcr.io/${OWNER_LC}/argus-backend"
            echo "worker=ghcr.io/${OWNER_LC}/argus-worker"
            echo "mcp=ghcr.io/${OWNER_LC}/argus-mcp"
            echo "tag=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      # Backend — the base image everything else derives from. Plain docker build
      # mirrors infra/docker-compose.yml (context backend/, dockerfile under infra/)
      # exactly, avoiding build-push-action context/file path ambiguity.
      - name: Build & push argus-backend
        run: |
          docker build \
            -f infra/backend/Dockerfile \
            -t "${{ steps.refs.outputs.backend }}:${{ steps.refs.outputs.tag }}" \
            -t "${{ steps.refs.outputs.backend }}:latest" \
            backend
          docker push "${{ steps.refs.outputs.backend }}:${{ steps.refs.outputs.tag }}"
          docker push "${{ steps.refs.outputs.backend }}:latest"

      # Worker — FROM ${BACKEND_IMAGE}. Pin the base to the backend tag we just
      # built (present in the local daemon, so the FROM resolves without a pull).
      - name: Build & push argus-worker
        run: |
          docker build \
            -f infra/worker/Dockerfile \
            --build-arg BACKEND_IMAGE="${{ steps.refs.outputs.backend }}:${{ steps.refs.outputs.tag }}" \
            -t "${{ steps.refs.outputs.worker }}:${{ steps.refs.outputs.tag }}" \
            -t "${{ steps.refs.outputs.worker }}:latest" \
            infra
          docker push "${{ steps.refs.outputs.worker }}:${{ steps.refs.outputs.tag }}"
          docker push "${{ steps.refs.outputs.worker }}:latest"

      # MCP — same image as the backend, run with an MCP command at deploy time.
      # Re-tag (shared layers, no rebuild) so ARGUS_MCP_IMAGE resolves in compose.
      - name: Tag & push argus-mcp (= backend)
        run: |
          docker tag "${{ steps.refs.outputs.backend }}:${{ steps.refs.outputs.tag }}" \
            "${{ steps.refs.outputs.mcp }}:${{ steps.refs.outputs.tag }}"
          docker tag "${{ steps.refs.outputs.backend }}:${{ steps.refs.outputs.tag }}" \
            "${{ steps.refs.outputs.mcp }}:latest"
          docker push "${{ steps.refs.outputs.mcp }}:${{ steps.refs.outputs.tag }}"
          docker push "${{ steps.refs.outputs.mcp }}:latest"

      - name: Summary
        run: |
          {
            echo "### App images pushed to GHCR"
            echo ""
            echo "| image | ref |"
            echo "|---|---|"
            echo "| backend | \`${{ steps.refs.outputs.backend }}:${{ steps.refs.outputs.tag }}\` |"
            echo "| worker  | \`${{ steps.refs.outputs.worker }}:${{ steps.refs.outputs.tag }}\` |"
            echo "| mcp     | \`${{ steps.refs.outputs.mcp }}:${{ steps.refs.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
