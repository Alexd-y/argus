schema_version: 1
playbook_id: reset.token-reuse-after-password-change
version: 1
title: Password reset - token reuse after password change
description: >-
  Weak password-recovery invariant: a single-use password reset token remains
  valid after it has already been consumed and the password changed, letting an
  attacker who later obtains the token take the account over again. The baseline
  is the first (legitimate) consumption of the token; the mutated request reuses
  the same token. A finding requires the reuse to succeed instead of being
  denied (400/401/403). Approval-gated (account mutation) - it changes account
  credentials and must be pre-authorized by an Engagement Authorization Profile.
category: account_lifecycle
provenance:
  source_url: https://github.com/Az0x7/vulnerability-Checklist
  commit: HEAD
  adapted_at: 2026-07-22
  note: >-
    Idea adapted from the Az0x7 vulnerability checklist (password reset token
    reuse class) to the ARGUS declarative playbook schema.
cwe:
  - 640
  - 384
wstg:
  - WSTG-ATHN-09
owasp_api:
  - API2:2023
tags:
  - account-lifecycle
  - password-reset
  - token-reuse
applies_when:
  methods:
    - POST
  path_globs:
    - /api/*/password/reset
    - /api/*/account/reset
  requires_openapi: false
  input_kinds:
    - body_json
required_capabilities:
  - http_client
required_principals:
  - victim
risk_level: high
requires_approval: true
preconditions:
  - kind: principal_available
    value: victim
steps:
  - id: first_use
    action: http_request
    principal: victim
    save_as: first_resp
    params:
      method: POST
      url: https://target.internal/api/v1/password/reset
      headers:
        Content-Type: application/json
      body: '{"token":"reset-token-test-fixture","new_password":"Rotated-1-not-real"}'
  - id: reuse_after_change
    action: http_request
    principal: victim
    save_as: reuse_resp
    params:
      method: POST
      url: https://target.internal/api/v1/password/reset
      headers:
        Content-Type: application/json
      body: '{"token":"reset-token-test-fixture","new_password":"Rotated-2-not-real"}'
  - id: register_token_cleanup
    action: register_cleanup
    params:
      cleanup_step_id: revoke_reset_token
assertions:
  - type: authn
    params:
      denied_statuses:
        - 400
        - 401
        - 403
required_evidence:
  - baseline_response
  - mutated_response
  - normalized_diff
cleanup:
  - id: revoke_reset_token
    action: http_request
    principal: victim
    params:
      method: DELETE
      url: https://target.internal/api/v1/test-fixtures/reset-token
      headers: {}
timeout_seconds: 180
max_concurrency: 1
