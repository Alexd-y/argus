family_id: dns_rebinding
description: >-
  DNS rebinding curriculum — non-routable synthetic hostnames (invalid TLD)
  for origin-validation drills. Inert; no live DNS callback or rebinding.
cwe_ids: [350, 346]
owasp_top10:
  - 'A10:2021'
risk_level: low
requires_approval: false
oast_required: false
payloads:
  - id: synthetic_host
    template: "argus-rebind-safe.invalid"
    confidence: suspected
    notes: Non-routable host (invalid TLD); never resolves.
  - id: synthetic_host_b
    template: "argus-rebind-safe-b.invalid"
    confidence: suspected
    notes: Second non-routable host for differential comparison.
  - id: marker
    template: "ARGUS_DNS_REBIND_SAFE_MARKER"
    confidence: suspected
    notes: Plain marker without host semantics.
  - id: multi_a_record
    template: "argus-rebind-multi-a.invalid"
    confidence: suspected
    notes: "Inert marker host denoting a multi-answer A-record set (routable + loopback) for rebind drills; confirmed in a drill when origin validation pins one A record while the fetcher later connects to the other."
  - id: zero_ip_marker
    template: "0.0.0.0"
    confidence: suspected
    notes: "0.0.0.0 all-interfaces landing IP, a classic rebind second-leg target; confirmed when an origin-validation drill treats it as external yet the fetcher binds it to a local service."
  - id: toctou_rebind_marker
    template: "argus-rebind-toctou.invalid"
    confidence: suspected
    notes: "Inert marker host representing a 0-TTL record that flips between the validation and the fetch lookups (TOCTOU); confirmed in a drill when the fetch re-resolves DNS instead of pinning the validated IP."
mutations:
  - name: case_flip
    description: Case-flip the host label to exercise case-insensitive rules.
encodings:
  - name: identity
    stages: []
    description: Literal marker pass-through.
