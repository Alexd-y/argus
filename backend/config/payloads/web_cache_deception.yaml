family_id: web_cache_deception
description: >-
  Web Cache Deception curriculum — benign static-suffix and path-parameter
  probes that test whether dynamic pages get cached as static assets. Inert.
cwe_ids: [525, 524]
owasp_top10:
  - 'A05:2021'
risk_level: low
requires_approval: false
oast_required: false
payloads:
  - id: css_suffix
    template: "/account/argus-wcd-safe.css"
    confidence: suspected
    notes: Appends a static .css suffix; probes cache-rule scope only.
  - id: js_suffix
    template: "/profile/argus-wcd-safe.js"
    confidence: suspected
    notes: Static .js suffix variant.
  - id: path_param_suffix
    template: "/settings;argus-wcd-safe.jpg"
    confidence: suspected
    notes: Path-parameter (semicolon) + image suffix probe.
  - id: marker
    template: "ARGUS_WCD_SAFE_MARKER"
    confidence: suspected
    notes: Plain marker without path semantics.
mutations:
  - name: case_flip
    description: Case-flip the suffix to exercise case-insensitive cache rules.
encodings:
  - name: identity
    stages: []
    description: Literal marker pass-through.
  - name: url_only
    stages: [url]
    description: URL-encoded for path sinks.
