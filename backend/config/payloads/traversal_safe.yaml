family_id: traversal_safe
description: >-
  Path-safety curriculum markers (no directory traversal sequences).
cwe_ids: [22]
owasp_top10:
  - 'A01:2021'
risk_level: low
requires_approval: false
oast_required: false
payloads:
  - id: safe_segment
    template: "argus-traversal-safe-segment-a"
    confidence: suspected
    notes: Single path segment; no dot-dot.
  - id: safe_segment_b
    template: "argus-traversal-safe-segment-b"
    confidence: suspected
    notes: Companion segment for comparisons.
  - id: safe_segment_c
    template: "argus-traversal-safe-segment-c"
    confidence: suspected
    notes: Third single path segment; no dot-dot sequences.
  - id: safe_control_missing
    template: "argus-traversal-safe-control-missing-marker"
    confidence: suspected
    notes: Known-nonexistent negative control; pairs with the safe_segment markers for differential length/timing confirmation.
mutations:
  - name: case_flip
    description: Case-flip the segment to exercise case-insensitive detection rules.
encodings:
  - name: identity
    stages: []
    description: Literal marker pass-through.
