family_id: graphql
description: >-
  GraphQL-specific probes covering introspection enumeration, batched
  alias overload, deep-recursion DoS markers, and field-suggestion
  oracles. Seeds are conservative read-only queries with low blast radius.
cwe_ids: [863, 209, 400]
owasp_top10:
  - 'A01:2021'
  - 'A05:2021'
risk_level: medium
requires_approval: false
oast_required: false
payloads:
  - id: introspection
    template: '{__schema{types{name}}}'
    confidence: likely
    notes: Standard introspection probe; unauthenticated success → schema leak.
  - id: introspection_typename
    template: '{__typename}'
    confidence: suspected
    notes: Minimal __typename probe; useful for endpoint fingerprinting.
  - id: alias_overload
    template: '{a:__typename b:__typename c:__typename d:__typename e:__typename}'
    confidence: suspected
    notes: Alias-overload (5x) probe; full DoS variant requires operator approval.
  - id: deep_recursion_seed
    template: '{me{friends{friends{friends{name}}}}}'
    confidence: suspected
    notes: Three-level recursion seed; depth limits should reject.
  - id: field_suggestion_oracle
    template: '{usre{id}}'
    confidence: suspected
    notes: Misspelled field; servers that return "Did you mean user?" leak schema.
  - id: oast_marker
    template: '{__type(name:"{canary}"){name}}'
    confidence: confirmed
    notes: Embeds a {canary} marker the OAST collector correlates if logged.
  - id: type_field_enum
    template: "{__type(name:\"User\"){name kind fields{name type{name kind}}}}"
    confidence: suspected
    notes: "Targeted __type field enumeration of a single named type; a populated fields array confirms per-type schema leakage even when full __schema introspection is disabled."
  - id: alias_mutation_brute
    template: "mutation{a1:submitCode(code:\"{canary}01\"){ status } a2:submitCode(code:\"{canary}02\"){ status } a3:submitCode(code:\"{canary}03\"){ status }}"
    confidence: suspected
    notes: "Bounded 3x aliased-mutation batch with distinct {canary}-tagged values; all aliases executing under one rate-limit decrement confirms per-request throttling is bypassable via alias batching."
  - id: directive_overload
    template: "{a:__typename @include(if:true) @include(if:true) @include(if:true)}"
    confidence: suspected
    notes: "Duplicated non-repeatable @include directives on one field; spec-compliant servers reject with 'can only be used once', so acceptance confirms a non-conformant parser exposed to directive-overload amplification."
mutations:
  - name: case_flip
    description: GraphQL field names are case-sensitive — flips produce known errors.
  - name: whitespace_alt
    description: Tab/space variants confirm parser robustness.
encodings:
  - name: identity
    stages: []
    description: Raw GraphQL query string.
  - name: url_only
    stages: [url]
    description: URL-encoded for GET endpoints.
  - name: base64
    stages: [base64]
    description: Base64-encoded; tests gateways that accept encoded queries.
