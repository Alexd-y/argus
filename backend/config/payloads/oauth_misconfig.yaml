family_id: oauth_misconfig
description: >-
  OAuth 2.0 flow bypass probes (CWE-290). redirect_uri bypass, state
  parameter omission, PKCE downgrade, and scope upgrade attempts.
cwe_ids: [290]
owasp_top10:
  - 'A01:2021'
  - 'A07:2021'
risk_level: high
requires_approval: true
oast_required: true
payloads:
  - id: redirect_uri_bypass
    template: "https://{oast_host}/callback"
    confidence: suspected
    notes: Attacker redirect_uri; tests strict vs lax redirect validation in OAuth flow.
  - id: state_omission
    template: "argus-oauth-empty-state-marker"
    confidence: suspected
    notes: Marker standing in for an empty state parameter; tests CSRF fallback on state absence.
  - id: pkce_downgrade
    template: "code_challenge=plain&code_challenge_method=plain"
    confidence: suspected
    notes: PKCE downgrade to plain method; bypasses S256 challenge verification.
  - id: scope_upgrade
    template: "read+write+admin+offline_access"
    confidence: suspected
    notes: Scope upgrade probe; tests whether the AS ignores incremental scope requests.
  - id: redirect_uri_idn_homograph
    template: "https://xn--{canary}--homograph.{oast_host}/cb"
    confidence: suspected
    notes: Punycode/IDN-homograph redirect_uri; tests ASCII-only string validators that skip Unicode confusable normalization.
  - id: pkce_verifier_omitted
    template: "grant_type=authorization_code&code={canary}"
    confidence: suspected
    notes: Token-exchange request with code_verifier omitted entirely; tests whether PKCE is actually enforced server-side.
  - id: state_fixed_replay
    template: "argus-oauth-fixed-state-{canary}"
    confidence: suspected
    notes: Constant/predictable state value reused across sessions; tests state-CSRF binding to the session rather than format-only checks.
mutations:
  - name: case_flip
    description: Flip case of redirect_uri host/scheme to probe case-sensitive redirect validation.
  - name: whitespace_alt
    description: Insert alternate whitespace in parameter values to test lenient URI parsers.
encodings:
  - name: identity
    stages: []
    description: Raw parameter values in OAuth authorization request.
  - name: url_only
    stages: [url]
    description: URL-encoded for redirect_uri and scope query parameters.
