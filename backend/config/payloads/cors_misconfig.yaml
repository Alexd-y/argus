family_id: cors_misconfig
description: >-
  CORS misconfiguration probes (CWE-942). Origin: null, Origin: attacker.com,
  Origin: sub.target.com, and Access-Control-Allow-Credentials bypass vectors.
cwe_ids: [942]
owasp_top10:
  - 'A01:2021'
  - 'A05:2021'
risk_level: medium
requires_approval: false
oast_required: true
payloads:
  - id: origin_null
    template: "null"
    confidence: suspected
    notes: "Origin: null header probe; sandboxed iframes and data: URIs send null origin."
  - id: origin_attacker
    template: "https://{oast_host}"
    confidence: suspected
    notes: Attacker-controlled Origin header; tests wildcard or reflexive ACAO responses.
  - id: origin_sub_target
    template: "https://{canary}.{target_domain}"
    confidence: suspected
    notes: Subdomain Origin probe; tests prefix-matching CORS allowlist bypass.
  - id: creds_bypass_origin
    template: "https://{target_domain}.{oast_host}"
    confidence: suspected
    notes: Suffix-matching Origin; bypasses ACAO-Credentials restrictions via suffix injection.
  - id: origin_sibling_nodot
    template: "https://evil-{target_domain}"
    confidence: suspected
    notes: "Attacker-registrable sibling domain lacking a dot separator (evil-target.com) that slips past a regex allowlist such as .*target\\.com$; confirmed when the response echoes this origin in Access-Control-Allow-Origin with Access-Control-Allow-Credentials:true and a browser credentialed read of authed data succeeds."
  - id: origin_suffix_noanchor
    template: "https://{canary}.{target_domain}.{oast_host}"
    confidence: suspected
    notes: "Attacker-hosted suffix origin that keeps a real .target.com label to satisfy a \\.target\\.com check missing its end anchor; confirmed when ACAO reflects the full attacker origin with ACAC:true and a cross-origin credentialed fetch returns a readable body."
  - id: origin_scheme_downgrade
    template: "http://{canary}.{target_domain}"
    confidence: suspected
    notes: "Cleartext http:// origin of an in-scope host; if ACAO reflects it with ACAC:true a network MITM on the plaintext host serves a page that reads the authed cross-origin body, confirmed by the reflected header plus a browser PoC fetched over http."
mutations:
  - name: case_flip
    description: Flip case of the Origin scheme/host to probe case-sensitive allowlist matching.
  - name: whitespace_alt
    description: Insert alternate whitespace around the Origin value to bypass naive parsers.
encodings:
  - name: identity
    stages: []
    description: Raw Origin header value.
