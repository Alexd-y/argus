family_id: file_upload_polyglot
description: >-
  Inert file-upload polyglot curriculum — benign magic-byte prefixes,
  double-extension and content-type markers. No script/executable content.
cwe_ids: [434, 436]
owasp_top10:
  - 'A04:2021'
risk_level: low
requires_approval: false
oast_required: false
payloads:
  - id: gif_header_marker
    template: "GIF89a ARGUS_UPLOAD_POLYGLOT_SAFE"
    confidence: suspected
    notes: Benign GIF magic-byte prefix + marker; probes content-sniffing only.
  - id: double_extension
    template: "argus-upload-safe.txt.png"
    confidence: suspected
    notes: Double-extension filename probe; inert (no code).
  - id: benign_content_type
    template: "ARGUS_UPLOAD_POLYGLOT_SAFE_CTYPE"
    confidence: suspected
    notes: Content-type mismatch marker; plain token.
  - id: benign_filename
    template: "argus-upload-safe-probe.txt"
    confidence: suspected
    notes: Neutral filename baseline for differential comparison.
  - id: svg_inline_marker
    template: "<?xml version=\"1.0\"?><svg xmlns=\"http://www.w3.org/2000/svg\"><!-- ARGUS_UPLOAD_POLYGLOT_SAFE --></svg>"
    confidence: suspected
    notes: "Inert SVG (comment marker only, no script/onload) probing the stored-render surface; confirmed when the upload is served inline as Content-Type image/svg+xml with no Content-Disposition: attachment, the precondition for SVG stored-XSS."
  - id: zip_slip_filename
    template: "../../../argus-upload-safe-probe.txt"
    confidence: suspected
    notes: "Zip-slip / path-traversal filename marker (../ sequences, inert .txt body) for archive-extraction and filename sinks; confirmed when the stored file lands outside the intended upload directory at the traversed path."
  - id: alt_exec_extension
    template: "argus-upload-safe.phtml"
    confidence: suspected
    notes: "Alternative interpreter extension (.phtml/.pht/.php5) to bypass a blocklist that drops only .php; inert marker body, confirmed when the fetched file executes (response differs from raw source) instead of being served as text/plain."
mutations:
  - name: case_flip
    description: Case-flip the marker to exercise case-insensitive detection rules.
encodings:
  - name: identity
    stages: []
    description: Literal marker pass-through.
