family_id: graphql_safe
description: >-
  Whitespace-only or curriculum names for GraphQL safety drills (no nested resolvers).
cwe_ids: [20]
owasp_top10:
  - 'A04:2021'
risk_level: low
requires_approval: false
oast_required: false
payloads:
  - id: curriculum_name
    template: "argusGraphqlSafeCurriculum"
    confidence: suspected
    notes: Single GraphQL name token; not a live query document.
  - id: underscore_marker
    template: "__argusGraphqlSafeCurriculum__"
    confidence: suspected
    notes: Underscore-delimited marker for parser drills (non-empty after strip).
  - id: nested_name_marker
    template: "argusGraphqlSafeNestedCurriculum"
    confidence: suspected
    notes: Third GraphQL name token for parser-depth drills.
  - id: alias_name_marker
    template: "argusGraphqlSafeAliasName"
    confidence: suspected
    notes: "Inert GraphQL alias-name token (non-empty after strip); read-only negative control that parses as a plain name and invokes no resolver."
mutations:
  - name: case_flip
    description: Case-flip the GraphQL name token for case-insensitive parser drills.
encodings:
  - name: identity
    stages: []
    description: Literal marker pass-through.
