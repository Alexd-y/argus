tool_id: commix
version: "1.0.0"
category: web_va
phase: vuln_analysis
risk_level: high
requires_approval: true
default_timeout_s: 600
cpu_limit: "1"
memory_limit: "1Gi"
seccomp_profile: runtime/default
network_policy:
  name: recon-active-tcp
  egress_allowlist: []
  dns_resolvers:
    - "1.1.1.1"
    - "9.9.9.9"
image: "argus-kali-web:latest"
command_template:
  - "commix"
  - "--url"
  - "{url}"
  - "--batch"
  - "--level"
  - "1"
parse_strategy: text_lines
evidence_artifacts:
  - "/out/commix_output.txt"
cwe_hints:
  - 77
  - 78
owasp_wstg:
  - "WSTG-INPV-12"
description: "commix (COMMand Injection eXploiter) — automated OS command-injection detection/exploitation. Runs --batch --level 1 against {url}, probing GET/POST params, headers and cookies for classic, eval-, time- and file-based command injection. APPROVAL REQUIRED: active exploitation attempt (CWE-77/78). Parsing via TEXT_LINES -> parsers.dispatch.unmapped_tool. Upstream: commixproject/commix. Backlog/dev1_md §4.9. P0-T1."
