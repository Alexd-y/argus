tool_id: commix
version: "1.0.0"
category: web_va
phase: vuln_analysis
risk_level: high
requires_approval: true
default_timeout_s: 600
cpu_limit: "1"
memory_limit: "1Gi"
seccomp_profile: runtime/default
network_policy:
  name: recon-active-tcp
  egress_allowlist: []
  dns_resolvers:
    - "1.1.1.1"
    - "9.9.9.9"
image: "argus-kali-web:latest"
command_template:
  - "commix"
  - "--url"
  - "{url}"
  - "--batch"
  - "--level"
  - "1"
parse_strategy: discovery_text
evidence_artifacts:
  - "/out/commix_output.txt"
cwe_hints:
  - 77
  - 78
