tool_id: whois
version: "1.0.0"
category: recon
phase: recon
risk_level: passive
requires_approval: false
default_timeout_s: 300
cpu_limit: "200m"
memory_limit: "128Mi"
seccomp_profile: runtime/default
network_policy:
  name: recon-passive
  egress_allowlist:
    - "0.0.0.0/0"
  dns_resolvers:
    - "1.1.1.1"
    - "9.9.9.9"
image: "argus-kali-recon:latest"
command_template:
  - "whois"
  - "{domain}"
  - ">"
  - "{out_dir}/whois.txt"
parse_strategy: whois_text
evidence_artifacts:
  - "/out/whois.txt"
cwe_hints: []
owasp_wstg:
  - "WSTG-INFO-01"
description: "Classic WHOIS protocol lookup returning registrant, NS, dates, and contact metadata (no RDAP fallback). Backlog/dev1_md §4.1."
